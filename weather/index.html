  var freshness = staleMin !== null && staleMin >= 1 ? '<span style="background:rgba(255,255,255,0.18);padding:1px 6px;border-radius:4px;font-weight:600">' + staleMin + ' min ago</span>' : '';

  html += '<div class="hero">' +
    '<div class="hero-top">' +
      '<div><div class="hero-location">' + esc(d.location||'Weather') + '</div>' +
        '<div class="hero-time">' + todayStr + ' · Updated ' + fmtTimeAmPm(d.generated_at) + (freshness ? ' · ' + freshness : '') + '</div></div>' +
    '</div>' +
    '<div class="hero-main">' +
      '<div class="hero-temp-group">' +
        '<div class="hero-temp">' + (current.temperature != null ? Math.round(current.temperature) : '--') + '<span class="unit">&deg;C</span></div>' +
      '</div>' +
      '<div class="hero-icon-group">' +
        '<div class="hero-icon">' + heroIcon + '</div>' +
        '<div class="hero-condition">' + esc(heroDesc) + '<div style="font-size:9px;opacity:0.55;margin-top:2px">Right now</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="hero-meta">' +
      '<span>Feels ' + (feelsLike != null ? Math.round(feelsLike) + '°' : '--') + '</span>' +
      '<span title="Next 24h high">&#9650; ' + (t24.overall_max != null ? Math.round(t24.overall_max) : '--') + '°</span>' +
      '<span title="Next 24h low">&#9660; ' + (t24.overall_min != null ? Math.round(t24.overall_min) : '--') + '°</span>' +
      (current.humidity != null ? '<span>' + current.humidity + '% humidity</span>' : '') +
    '</div>';

  var heroEnding = hero.precip_ending || null;
  if (heroEnding) {
    var endT = parseTime(heroEnding.time);
    var endMin = endT ? Math.round((endT.getTime() - now.getTime()) / 60000) : null;
    if (endMin !== null && endMin <= 0) {
      html += '<div class="hero-summary" style="font-weight:600;opacity:0.95;">☂️ Rain should have ended</div>';
    } else if (endMin !== null && endMin < 60) {
      html += '<div class="hero-summary" style="font-weight:600;opacity:0.95;">☂️ Ending in ~' + endMin + ' min (by ' + fmtShortTime(heroEnding.time) + ')</div>';
    } else {
      html += '<div class="hero-summary" style="font-weight:600;opacity:0.95;">☂️ Ending by ' + fmtShortTime(heroEnding.time) + '</div>';
    }
  } else if (heroEvt) {
    var evtText = '';
    var evtLabel = heroEvt.description || heroEvt.type;
    var evtT = parseTime(heroEvt.time);
    var evtMin = evtT ? Math.round((evtT.getTime() - now.getTime()) / 60000) : heroEvt.starts_in_minutes;
    if (evtMin <= 0) {
      evtText = heroEvt.icon + ' ' + evtLabel + ' now (' + heroEvt.probability + '% probability)';
    } else if (evtMin < 60) {
      evtText = heroEvt.icon + ' ' + evtLabel + ' in ~' + evtMin + ' min (' + heroEvt.probability + '%)';
    } else {
      var evtTime = fmtTimeAmPm(heroEvt.time);
      evtText = heroEvt.icon + ' ' + evtLabel + ' at ' + evtTime + ' (' + heroEvt.probability + '%)';
    }
    html += '<div class="hero-summary" style="font-weight:600;opacity:0.95;">' + evtText + '</div>';
  }

  if (feelsBreak.available && feelsBreak.reason && Math.abs(feelsBreak.difference) >= 1.5) {
    html += '<div class="hero-summary">' + esc(feelsBreak.reason) + '</div>';
  }
  html += '</div>';

  // ───── HOURLY SCROLLER ─────
  html += '<div class="section-label">Hourly Forecast</div>';
  html += '<div class="hourly-scroll">';
  const hrs = hourlyComp.slice(0, 48);
  const todayDate = now.getDate();
  let lastDayShown = todayDate;

  hrs.forEach((h, i) => {
    const t = parseTime(h.time);
    const hr = t ? t.getHours() : i;
    const tDate = t ? t.getDate() : todayDate;
    const isNewDay = tDate !== lastDayShown && i > 0;

    let timeLbl, dayLbl = '';
    if (i === 0) {
      timeLbl = 'Now';
      dayLbl = 'TODAY';
    } else {
      timeLbl = fmtHour(hr);
      if (isNewDay) {
        const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
        if (t && t.getDate() === tomorrow.getDate() && t.getMonth() === tomorrow.getMonth()) {
          dayLbl = 'TMRW';
        } else if (t) {
          dayLbl = t.toLocaleDateString('en-US', {weekday:'short'}).toUpperCase();
        }
        lastDayShown = tDate;
      }
    }

    var icon = (h.weather || {}).icon || '';
    var desc = (h.weather || {}).description || '';
    if (i === 0 && hero.condition) { desc = hero.condition; icon = hero.icon || icon; }
    var tmp = h.temp && h.temp.available ? Math.round(h.temp.mean) : '--';
    var fl = h.feels_like && h.feels_like.available ? Math.round(h.feels_like.mean) : '';
    if (i === 0) {
      if (current.temperature != null) tmp = Math.round(current.temperature);
      if (feelsBreak.available) fl = Math.round(feelsBreak.feels_like);
    }
    const pp = h.precip_prob && h.precip_prob.available ? Math.round(h.precip_prob.mean) : 0;

    html += '<div class="hour-card' + (i === 0 ? ' now' : '') + '">';
    if (dayLbl) html += '<div class="hour-day-label">' + dayLbl + '</div>';
    html += '<div class="hour-time">' + timeLbl + '</div>' +
      '<div class="hour-icon">' + icon + '</div>' +
      '<div class="hour-temp">' + tmp + '&deg;</div>';
    if (fl !== '') html += '<div class="hour-feels">Feels ' + fl + '&deg;</div>';
    if (desc) html += '<div class="hour-desc">' + esc(desc) + '</div>';
    if (pp > 0) {
      html += '<div class="hour-precip-label">' + pp + '%</div>';
      html += '<div class="hour-precip-bar"><div class="hour-precip-fill" style="width:' + pp + '%"></div></div>';
    }
    html += '</div>';
  });
  html += '</div>';

  // ───── 10-DAY FORECAST ─────
  if (dailyForecast.length) {
    var dfModel = dailyForecast[0] && dailyForecast[0].model ? ' (' + esc(dailyForecast[0].model) + ')' : '';
    var dfTitle = dailyForecast.length + '-Day Forecast';
    html += '<div class="section-label">' + dfTitle + '<span style="font-weight:400;font-size:10px;opacity:0.6;margin-left:6px">' + dfModel + '</span></div>';
    html += '<div class="daily-strip">';
    const allHighs = dailyForecast.map(x => x.high).filter(v => v != null);
    const allLows = dailyForecast.map(x => x.low).filter(v => v != null);
    const rangeMin = Math.min(...allLows, ...allHighs);
    const rangeMax = Math.max(...allLows, ...allHighs);
    const rangeSpan = rangeMax - rangeMin || 1;

    dailyForecast.forEach((day, i) => {
      let dayLabel;
      if (i === 0) dayLabel = 'Today';
      else if (i === 1) dayLabel = 'Tmrw';
      else dayLabel = day.day_label || '';

      const lo = day.low != null ? Math.round(day.low) : '--';
      const hi = day.high != null ? Math.round(day.high) : '--';
      const pp = day.precip_chance != null && day.precip_chance > 0 ? day.precip_chance + '%' : '';
      const barLeft = day.low != null ? ((day.low - rangeMin) / rangeSpan * 100) : 0;
      const barWidth = (day.high != null && day.low != null) ? ((day.high - day.low) / rangeSpan * 100) : 0;

      html += '<div class="daily-row">' +
        '<div class="daily-day">' + esc(dayLabel) + '</div>' +
        '<div class="daily-icon">' + (day.icon || '') + '</div>' +
        '<div class="daily-desc" ' + (i === 0 ? 'title="Dominant forecast for today, may differ from current conditions"' : '') + '>' + esc(day.description || '') + '</div>' +
        '<div class="daily-precip">' + pp + '</div>' +
        '<div class="daily-bar-wrap">' +
          '<div class="daily-low">' + lo + '&deg;</div>' +
          '<div class="daily-bar-track"><div class="daily-bar-fill" style="left:' + barLeft.toFixed(1) + '%;width:' + barWidth.toFixed(1) + '%"></div></div>' +
          '<div class="daily-high">' + hi + '&deg;</div>' +
        '</div>' +
      '</div>';
    });
    html += '</div>';
  }

  // ───── RADAR MAP ─────
  const radar = d.radar || null;
  if (radar && radar.image_base64) {
    html += '<div class="section-label">Radar & Forecast</div>';
    html += buildRadarCarousel(radar, d.location, convAlert);
  }

  // ───── TEMPERATURE / SNOWFALL MAPS (additional to radar, not a replacement) ─────
  const climateMap = d.climate_map || null;
  if (climateMap && climateMap.temp_frames && climateMap.temp_frames.length) {
    html += '<div class="section-label">Temperature Map</div>';
    html += buildClimateMap(climateMap, 'temp', d.location);
  }
  if (climateMap && climateMap.snow_frames && climateMap.snow_frames.length) {
    html += '<div class="section-label">Snowfall Accumulation Map</div>';
    html += buildClimateMap(climateMap, 'snow', d.location);
  }

  // ───── WIDGET GRID ─────
  html += '<div class="section-label">Current Conditions</div>';
  html += '<div class="widget-grid">';

  // W1: Feels-Like Breakdown
  if (feelsBreak.available) {
    html += '<div class="widget wide">' +
      '<div class="widget-label"><span class="wl-icon">🌡️</span> Feels-Like Breakdown</div>' +
      '<div style="display:flex;gap:20px;align-items:baseline">' +
        '<div><span style="font-size:13px;color:var(--text-dim)">Actual</span><div class="widget-value" style="font-size:24px">' + feelsBreak.temp + '<span class="widget-unit">°C</span></div></div>' +
        '<div style="font-size:22px;color:var(--text-faint)">→</div>' +
        '<div><span style="font-size:13px;color:var(--text-dim)">Feels like</span><div class="widget-value" style="font-size:24px">' + feelsBreak.feels_like + '<span class="widget-unit">°C</span></div></div>' +
        '<div style="font-size:13px;font-weight:600;color:' + (feelsBreak.difference > 0 ? 'var(--red)' : feelsBreak.difference < -2 ? 'var(--accent)' : 'var(--green)') + '">' +
          (feelsBreak.difference > 0 ? '+' : '') + feelsBreak.difference + '°</div>' +
      '</div>' +
      '<div class="widget-sub">' + esc(feelsBreak.reason) + '</div>' +
      '<div class="widget-explain">The "feels like" temperature accounts for wind chill (cold) and humidity/humidex (heat) to show how your body actually perceives the temperature.</div>' +
    '</div>';
  }

  // W2: Clothing Suggestion (5-day)
  const clothingFc = d.clothing_forecast || [];
  if (clothing.available || clothingFc.length) {
    html += '<div class="widget wide">' +
      '<div class="widget-label"><span class="wl-icon">👔</span> What to Wear</div>';
    if (clothing.available) {
      html += '<div class="widget-value" style="font-size:16px;font-weight:700;letter-spacing:0;margin-bottom:4px">Right Now: ' + esc(clothing.layers) + '</div>' +
        '<div class="widget-sub" style="margin-bottom:8px">' + esc(clothing.tip) + '</div>';
    }
    if (clothingFc.length) {
      clothingFc.forEach(function(cf) {
        html += '<div style="display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid var(--card-border);font-size:12px">' +
          '<div style="width:65px;font-weight:700;flex-shrink:0">' + esc(cf.day) + '</div>' +
          '<div style="flex:1"><span style="font-weight:600">' + esc(cf.layers) + '</span>' +
            (cf.high != null ? ' <span style="color:var(--text-dim)">(' + cf.high + '°/' + cf.low + '°)</span>' : '') +
            (cf.precip ? ' <span style="color:var(--accent)">☂️</span>' : '') +
          '</div>' +
        '</div>';
      });
    }
    html += '<div class="widget-explain">Based on forecast high temperatures and precipitation chances for each day.</div>' +
    '</div>';
  }

  // W3: Outdoor Activity Rating
  if (outdoor.available) {
    const scoreColor = outdoor.score >= 80 ? 'var(--green)' : outdoor.score >= 60 ? 'var(--yellow)' : outdoor.score >= 40 ? 'var(--orange)' : 'var(--red)';
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">🏃</span> Outdoor Rating</div>' +
      '<div class="score-ring" style="background:conic-gradient(' + scoreColor + ' 0% ' + outdoor.score + '%, var(--score-bg) ' + outdoor.score + '% 100%)">' +
        '<div class="score-ring-inner">' +
          '<div class="score-ring-num" style="color:' + scoreColor + '">' + outdoor.score + '</div>' +
          '<div class="score-ring-label">' + esc(outdoor.label) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="widget-sub">' + esc(outdoor.description) + '</div>' +
    '</div>';
  }

  // W4: Storm Risk
  // Prefers the convective engine, which reads shear and helicity as well as
  // CAPE. The old CAPE-only bucket stays as a fallback for when the
  // convective feeds are down, since CAPE alone cannot tell a severe day
  // from an ordinary one.
  var convPeak = (conv.available && conv.peak) ? conv.peak : null;
  if (convPeak) {
    var svPalette = {red:'var(--red)', orange:'var(--orange)',
                     yellow:'var(--yellow)', green:'var(--green)'};
    var cpCol = svPalette[convPeak.risk_color] || 'var(--text)';
    var cpWhen = convPeak.day_offset === 0 ? 'today'
               : convPeak.day_offset === 1 ? 'tomorrow'
               : (parseTime(convPeak.date + 'T12:00') || new Date()).toLocaleDateString('en-US', {weekday:'long'});
    var cpHaz = (convPeak.hazards || []).map(function(h) { return h.icon; }).join(' ');
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">⛈️</span> Storm Risk</div>' +
      '<div class="widget-value" style="font-size:17px;font-weight:700;letter-spacing:0;color:' + cpCol + '">' +
        esc(convPeak.risk_label) + '</div>' +
      '<div class="widget-sub">Peak ' + esc(cpWhen) +
        (convPeak.confidence_label ? ' · ' + esc(convPeak.confidence_label) + ' confidence' : '') +
        (cpHaz ? ' · ' + cpHaz : '') + '</div>' +
      ((convPeak.window && convPeak.window.phrase) ?
        '<div class="widget-sub" style="font-weight:600">🕐 ' + esc(convPeak.window.phrase) + '</div>' : '') +
      '<div class="widget-explain">' +
        esc((convPeak.plain && convPeak.plain.headline) || convPeak.detail || '') + '</div>' +
    '</div>';
  } else if (storm.available) {
    const stormColors = {none:'var(--green)', low:'var(--green)', moderate:'var(--yellow)', high:'var(--orange)', severe:'var(--red)'};
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">⛈️</span> Storm Risk</div>' +
      '<div class="widget-value" style="font-size:18px;font-weight:600;letter-spacing:0;color:' + (stormColors[storm.level]||'var(--text)') + '">' + esc(storm.level.charAt(0).toUpperCase() + storm.level.slice(1)) + '</div>' +
      '<div class="widget-sub">' + esc(storm.description) + '</div>' +
      (storm.max_cape > 0 ? '<div class="widget-explain">CAPE (storm energy) = ' + storm.max_cape + ' J/kg' + (storm.peak_time ? ' · Peak at ' + fmtHour(parseTime(storm.peak_time)?.getHours()) : '') + '</div>' : '') +
    '</div>';
  }

  // W4b: Lightning right now — shown only while there is lightning nearby.
  var convLtg = (conv.available && conv.lightning) ? conv.lightning : {};
  if (convLtg.available && convLtg.active) {
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">⚡</span> Lightning Now</div>' +
      '<div class="widget-value" style="font-size:17px;font-weight:700;letter-spacing:0;color:var(--orange)">Active</div>' +
      '<div class="widget-sub">' + convLtg.flash_density + ' flashes/km²/min nearby</div>' +
      '<div class="widget-explain">Live lightning detection from Environment Canada. If this is on, storms are overhead or very close.</div>' +
    '</div>';
  }

  // W5: Air Quality (moved up — user prioritizes this)
  if (aqi.available) {
    const aqiColor = aqiToColor(aqi.aqi);
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">🫁</span> Air Quality</div>' +
      '<div class="aqi-gauge">' +
        '<div class="aqi-number" style="color:' + aqiColor + '">' + aqi.aqi + '</div>' +
        '<div><div class="aqi-category" style="color:' + aqiColor + '">' + esc(aqi.category||'') + '</div></div>' +
      '</div>' +
      '<div style="height:6px;border-radius:3px;background:linear-gradient(90deg,var(--green) 0%,var(--green) 10%,var(--yellow) 20%,var(--orange) 30%,var(--red) 40%,var(--purple) 60%,#7f1d1d 100%);margin:4px 0;position:relative">' +
        '<div class="uv-marker" style="left:' + Math.min(aqi.aqi / 500 * 100, 100) + '%"></div>' +
      '</div>' +
      '<div class="widget-sub">' + esc(aqi.tip||'') + '</div>' +
      '<div class="widget-explain">US AQI scale: 0-50 Good, 51-100 Moderate, 101-150 Unhealthy for Sensitive Groups, 151-200 Unhealthy, 201-300 Very Unhealthy, 301-500 Hazardous.' +
        (aqi.dominant_pollutant ? ' Main pollutant: ' + esc(formatPollutant(aqi.dominant_pollutant)) + '.' : '') +
        (aqi.pm2_5 != null ? ' PM2.5: ' + aqi.pm2_5 + ' µg/m³.' : '') + '</div>' +
    '</div>';
  }

  // W6: Humidity + Dewpoint Comfort
  const humVal = current.humidity ?? (hourlyComp.length && hourlyComp[0].humidity && hourlyComp[0].humidity.available ? Math.round(hourlyComp[0].humidity.mean) : null);
  if (humVal != null || (dewComfort && dewComfort.available)) {
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">💧</span> Humidity</div>';
    if (humVal != null) {
      html += '<div class="widget-value">' + humVal + '<span class="widget-unit">%</span></div>';
    }
    if (dewComfort.available) {
      html += '<div class="widget-sub" style="font-weight:600;color:' +
        (dewComfort.comfort === 'Dry' || dewComfort.comfort === 'Comfortable' ? 'var(--green)' :
         dewComfort.comfort === 'Slightly muggy' ? 'var(--yellow)' : 'var(--red)') + '">' +
        esc(dewComfort.comfort) + ' (Dewpoint ' + dewComfort.dewpoint + '°)</div>';
      html += '<div class="widget-explain">' + esc(dewComfort.description) + '</div>';
    } else {
      const dp = current.dewpoint;
      if (dp != null) html += '<div class="widget-sub">Dewpoint: ' + dp + '°</div>';
      html += '<div class="widget-explain">Humidity is how much moisture is in the air. Higher humidity makes hot days feel hotter and slows sweat evaporation.</div>';
    }
    html += '</div>';
  }

  // W7: UV Index
  const curUV = hourlyComp.length && hourlyComp[0].uv && hourlyComp[0].uv.available ? Math.round(hourlyComp[0].uv.mean) : null;
  if (curUV != null) {
    const uvLevel = uvCategory(curUV);
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">☀️</span> UV Index</div>' +
      '<div class="widget-value">' + curUV + '</div>' +
      '<div class="uv-bar"><div class="uv-marker" style="left:' + Math.min((curUV/11)*100,100) + '%"></div></div>' +
      '<div class="widget-sub">' + esc(uvLevel) + '</div>' +
      '<div class="widget-explain">UV measures sun radiation intensity. Apply SPF 30+ when UV is 3 or above. Peak UV is usually between 11 AM and 3 PM.</div>' +
    '</div>';
  }

  // W8: Visibility
  const visVal = current.visibility ?? (hourlyComp.length && hourlyComp[0].visibility && hourlyComp[0].visibility.available ? Math.round(hourlyComp[0].visibility.mean / 1000) : null);
  if (visVal != null) {
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">👁️</span> Visibility</div>' +
      '<div class="widget-value">' + visVal + '<span class="widget-unit"> km</span></div>' +
      '<div class="widget-sub">' + visibilityTip(visVal) + '</div>' +
      '<div class="widget-explain">How far you can see clearly. Fog, rain, and snow reduce visibility. Under 1 km means driving hazard.</div>' +
    '</div>';
  }

  // W9: Pressure
  const pressureVal = current.pressure ?? (hourlyComp.length && hourlyComp[0].pressure && hourlyComp[0].pressure.available ? Math.round(hourlyComp[0].pressure.mean * 10) / 10 : null);
  if (pressureVal != null) {
    const pressureDisplay = pressureVal > 900 ? (pressureVal / 10).toFixed(1) : pressureVal;
    const pressureUnit = 'kPa';
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">📊</span> Pressure</div>' +
      '<div class="widget-value" style="font-size:22px">' + pressureDisplay + '<span class="widget-unit"> ' + pressureUnit + '</span></div>' +
      '<div class="widget-sub">' + pressureTrend(current.pressure_trend) + '</div>' +
      '<div class="widget-explain">Atmospheric pressure. Rising pressure usually means clearing skies. Falling pressure often brings clouds and rain.</div>' +
    '</div>';
  }

  // W10: Cloud Cover
  if (cloud.available) {
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">☁️</span> Cloud Cover</div>' +
      '<div class="widget-value">' + cloud.current_pct + '<span class="widget-unit">%</span></div>' +
      '<div class="widget-sub" style="font-weight:600">' + esc(cloud.description) + '</div>' +
      '<div class="widget-explain">Trend: ' + esc(cloud.trend) + ' over the next 6 hours (avg ' + cloud.avg_6h_pct + '%).</div>' +
    '</div>';
  }

  // W11: Sunrise / Sunset
  if (sun.available) {
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">🌅</span> Sun</div>' +
      buildSunArc(sun) +
      (sun.daylight_hours ? '<div class="widget-explain">' + sun.daylight_hours + ' hours of daylight today.</div>' : '') +
    '</div>';
  }

  // W12: Moon Phase
  html += '<div class="widget">' +
    '<div class="widget-label"><span class="wl-icon">🌙</span> Moon</div>' +
    '<div style="text-align:center;margin:4px 0">' +
      '<div style="font-size:32px;line-height:1">' + (moon.icon || '\u{1F311}') + '</div>' +
      '<div style="font-size:13px;font-weight:600;margin-top:4px">' + esc(moon.phase_name || 'Unknown') + '</div>' +
    '</div>' +
    (moon.illumination_pct != null ? '<div class="widget-sub" style="text-align:center">' + moon.illumination_pct + '% illuminated</div>' : '') +
    '<div class="widget-explain">The moon goes through an approximately 29.5-day cycle from new moon to full moon and back.</div>' +
  '</div>';

  // W13: Wind (moved down — user prioritizes AQI over wind)
  const modelWind = hourlyComp.length && hourlyComp[0].wind_speed && hourlyComp[0].wind_speed.available ? Math.round(hourlyComp[0].wind_speed.mean) : null;
  const modelGust = hourlyComp.length && hourlyComp[0].wind_gust && hourlyComp[0].wind_gust.available ? Math.round(hourlyComp[0].wind_gust.mean) : null;
  const modelDir = hourlyComp.length && hourlyComp[0].wind_dir && hourlyComp[0].wind_dir.available ? Math.round(hourlyComp[0].wind_dir.mean) : null;
  const curWind = current.wind_speed ?? modelWind;
  const curGust = current.wind_gust ?? modelGust;
  const curDir = current.wind_direction || (modelDir != null ? degToDir(modelDir) : '');
  const dirDeg = dirToDeg(curDir) ?? modelDir;

  if (curWind != null) {
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">💨</span> Wind</div>' +
      '<div class="wind-compass">' +
        '<span class="wind-n">N</span><span class="wind-e">E</span><span class="wind-s">S</span><span class="wind-w">W</span>' +
        (dirDeg != null ? '<div class="wind-arrow" style="transform:rotate(' + dirDeg + 'deg)"></div>' : '') +
      '</div>' +
      '<div style="text-align:center">' +
        '<div class="widget-value" style="font-size:20px">' + curWind + ' <span class="widget-unit">km/h ' + esc(curDir) + '</span></div>' +
        (curGust ? '<div class="widget-sub" style="color:' + (curGust >= 90 ? 'var(--red)' : curGust >= 70 ? '#e09522' : curGust >= 40 ? 'var(--yellow)' : 'var(--text-secondary)') + ';font-weight:' + (curGust >= 70 ? '700' : '500') + '">Gusts ' + curGust + ' km/h' + (curGust >= 90 ? ' ⚠️' : curGust >= 70 ? ' ⚠' : '') + '</div>' : '') +
      '</div>' +
      '<div class="widget-explain">Wind direction shows where the wind is coming FROM. Gusts are brief bursts faster than the sustained speed.</div>' +
    '</div>';
  }

  // W14b: Freezing Level
  if (freezeLevel && freezeLevel.height_m != null) {
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">🏔️</span> Freezing Level</div>' +
      '<div class="widget-value" style="font-size:22px">' + Math.round(freezeLevel.height_m) + '<span class="widget-unit"> m</span></div>' +
      '<div class="widget-sub">' + esc(freezeLevel.description || '') + '</div>' +
      '<div class="widget-explain">Height where temperature reaches 0°C. Below this altitude, precipitation falls as rain; above it, as snow or ice.</div>' +
    '</div>';
  }

  // W15: Precipitation (24h)
  const p24 = precip.next_24h || {};
  if (p24.available && p24.occurrence !== 'none') {
    html += '<div class="widget wide">' +
      '<div class="widget-label"><span class="wl-icon">🌧️</span> Precipitation (Next 24h)</div>' +
      '<div style="display:flex;gap:16px;align-items:baseline;margin:4px 0">' +
        '<div class="widget-value">' + avgPrecip(p24) + '<span class="widget-unit"> mm</span></div>' +
        '<div style="font-size:12px;color:var(--text-dim)">' + fmtOccurrence(p24.occurrence) + ' · ' + esc(p24.precip_type||'') + '</div>' +
      '</div>' +
      '<div class="widget-explain">Total precipitation expected across all weather models in the next 24 hours. "' + fmtOccurrence(p24.occurrence) + '" means ' + explainOccurrence(p24.occurrence) + '.</div>' +
    '</div>';
  }

  // W17: Snow Depth
  if (snowDepth.available) {
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">🏔️</span> Snow Depth</div>' +
      '<div class="widget-value">' + snowDepth.depth_cm + '<span class="widget-unit"> cm</span></div>' +
      '<div class="widget-sub">Current snow on the ground.</div>' +
    '</div>';
  }

  // W19: Lake Conditions (Marine)
  const marineHourly = (d.marine && d.marine.hourly) || [];
  const marineNow = marineHourly.length ? marineHourly.reduce(function(closest, rec) {
    const t = parseTime(rec.time);
    if (!t) return closest;
    const diff = Math.abs(t - new Date());
    return (!closest || diff < closest._diff) ? Object.assign({_diff: diff}, rec) : closest;
  }, null) : null;
  if (marineNow && marineNow.wave_height != null) {
    const waveM = marineNow.wave_height;
    const waveDir = marineNow.wave_direction;
    const wavePeriod = marineNow.wave_period;
    const waveLevel = waveM < 0.3 ? ['Calm','var(--green)'] : waveM < 0.6 ? ['Light chop','var(--green)'] :
      waveM < 1.2 ? ['Moderate','var(--yellow)'] : waveM < 2.0 ? ['Rough','var(--orange)'] : ['Very rough','var(--red)'];
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">🌊</span> Lake Conditions</div>' +
      '<div class="widget-value">' + waveM.toFixed(1) + '<span class="widget-unit"> m waves</span></div>' +
      '<div class="widget-sub" style="font-weight:600;color:' + waveLevel[1] + '">' + waveLevel[0] +
        (wavePeriod != null ? ' · ' + Math.round(wavePeriod) + 's period' : '') +
        (waveDir != null ? ' · ' + compassDir(waveDir) : '') + '</div>' +
      '<div class="widget-explain">Lake Ontario wave height and period. Higher waves and shorter periods mean choppier conditions for boating or shoreline activity.</div>' +
    '</div>';
  }

  // W18: Forecast Confidence
  html += '<div class="widget">' +
    '<div class="widget-label"><span class="wl-icon">🎯</span> Forecast Confidence</div>' +
    '<div style="margin:4px 0">' +
      '<div class="stat-row"><span class="stat-label">Next 6h</span>' +
        '<span class="confidence-badge confidence-' + (conf.next_6h||'unknown') + '">' + (conf.next_6h||'?') + '</span></div>' +
      '<div class="stat-row"><span class="stat-label">Next 24h</span>' +
        '<span class="confidence-badge confidence-' + (conf.next_24h||'unknown') + '">' + (conf.next_24h||'?') + '</span></div>' +
    '</div>' +
    '<div class="widget-explain">When multiple weather models agree, confidence is high. Large disagreements between models mean more uncertainty.</div>' +
  '</div>';

  html += '</div>'; // end widget-grid

  // ───── SEVERE CONVECTIVE DETAIL ─────
  // Only rendered when there is something to say. On a quiet week the whole
  // block disappears rather than showing a row of zeroes.
  if (conv.available) {
    var convDays = (conv.days || []).filter(function(x) {
      return x.risk_level > 0 || (x.thunder_prob_pct || 0) >= 15;
    });
    var svColorVar = {red:'var(--red)', orange:'var(--orange)',
                      yellow:'var(--yellow)', green:'var(--green)'};

    if (convDays.length) {
      html += '<div class="section-label">Storm Risk Outlook</div>';
      html += '<div class="chart-card">' +
        '<h3>Day-by-day severe thunderstorm risk</h3>';
      for (var ci = 0; ci < convDays.length; ci++) {
        var cd = convDays[ci];
        var col = svColorVar[cd.risk_color] || 'var(--text-dim)';
        var dt = parseTime(cd.date + 'T12:00');
        var dayName = cd.day_offset === 0 ? 'Today'
                    : cd.day_offset === 1 ? 'Tomorrow'
                    : (dt ? dt.toLocaleDateString('en-US', {weekday:'short'}) : cd.date);
        var dayNum = dt ? dt.toLocaleDateString('en-US', {month:'short', day:'numeric'}) : '';
        var hazIcons = (cd.hazards || []).map(function(h) { return h.icon; }).join(' ');
        var cdWin = cd.window || {};
        html += '<div class="sv-day">' +
          '<div><div class="sv-day-date">' + esc(dayName) + '</div>' +
            '<div class="sv-day-sub">' + esc(dayNum) + '</div></div>' +
          '<div style="display:flex;gap:8px">' +
            '<div class="sv-dot" style="background:' + col + '"></div>' +
            '<div style="flex:1">' +
              '<div class="sv-day-label" style="color:' + col + '">' + esc(cd.risk_label) +
                (cd.authoritative ? '<span class="sv-auth">EC OUTLOOK</span>' : '') + '</div>' +
              (cdWin.phrase ?
                '<div class="sv-day-when">🕐 ' + esc(cdWin.phrase) + '</div>' : '') +
              (cd.plain && cd.plain.headline ?
                '<div class="sv-day-plain">' + esc(cd.plain.headline) + '</div>' : '') +
              // The technical restatement is intentionally not shown here.
              // It lives in the ingredients panel below, where it is
              // explained, rather than as unglossed jargon in the timeline.
              ((cd.plain && (cd.plain.lines || []).length) ?
                '<div class="sv-day-detail">' + esc(cd.plain.lines.join(' ')) + '</div>' : '') +
              (hazIcons ? '<div class="sv-day-haz">' + hazIcons + '</div>' : '') +
            '</div>' +
          '</div>' +
          '<div class="sv-conf">' + esc(cd.confidence_label || '') + '</div>' +
        '</div>';
      }
      html += '<div class="widget-explain" style="margin-top:8px">' + esc(conv.method || '') + '</div>';
      html += '</div>';
    }

    // Why: the ingredients behind the peak day.
    var ing = conv.ingredients || {};
    if (ing.available && (ing.rows || []).length) {
      html += '<div class="chart-card">' +
        '<h3>Why the risk is what it is' + (ing.for_date ? ' — ' + esc(ing.for_date) : '') + '</h3>' +
        '<div class="widget-explain" style="margin:-2px 0 8px">' +
          'Optional detail. Each bar is one thing the atmosphere needs for a big storm. ' +
          'Green means that ingredient is missing, red means it is fully there.</div>';
      for (var ii = 0; ii < ing.rows.length; ii++) {
        var r = ing.rows[ii];
        // An inverted row (the cap) is good when it is low, so the bar
        // colour has to run the other way.
        var frac = r.invert ? (100 - r.pct) : r.pct;
        var barCol = frac >= 75 ? 'var(--red)' : frac >= 50 ? 'var(--orange)'
                   : frac >= 25 ? 'var(--yellow)' : 'var(--green)';
        html += '<div class="sv-ing">' +
          '<div class="sv-ing-head">' +
            '<span class="sv-ing-name">' + esc(r.name) +
              (r.tech ? '<span class="sv-ing-tech">' + esc(r.tech) + '</span>' : '') + '</span>' +
            '<span class="sv-ing-val">' + esc(r.value) + '</span>' +
          '</div>' +
          '<div class="sv-ing-track"><div class="sv-ing-fill" style="width:' + r.pct +
            '%;background:' + barCol + '"></div></div>' +
          '<div class="sv-ing-read">' + esc(r.reading) + '</div>' +
          '<div class="sv-ing-explain">' + esc(r.explain) + '</div>' +
        '</div>';
      }
      html += '<div class="widget-explain" style="margin-top:10px">' + esc(ing.note || '') + '</div>';
      html += '</div>';
    }

    // Extended range: probability only, and labelled as such.
    var ext = conv.extended || {};
    var extRows = (ext.rows || []).filter(function(x) { return (x.prob_1000 || 0) > 0; });
    if (ext.available && extRows.length) {
      html += '<div class="chart-card">' +
        '<h3>Further ahead — days worth keeping an eye on</h3>' +
        '<div class="widget-explain" style="margin:-2px 0 8px">' +
          'Beyond about three days nobody can forecast a specific storm. What this ' +
          'shows is how many of roughly a hundred separate forecast runs produce ' +
          'enough fuel for storms on each day. A high number is a reason to check ' +
          'back, not a forecast.</div>' +
        '<table class="sv-ext"><thead><tr>' +
          '<th>Day</th><th>Typical fuel</th><th>Most fuel</th>' +
          '<th>Runs with enough</th><th>With lots</th>' +
        '</tr></thead><tbody>';
      for (var ei = 0; ei < extRows.length; ei++) {
        var er = extRows[ei];
        var edt = parseTime(er.date + 'T12:00');
        var p1 = er.prob_1000 || 0;
        var pc = p1 >= 60 ? 'var(--red)' : p1 >= 35 ? 'var(--orange)'
               : p1 >= 15 ? 'var(--yellow)' : 'var(--green)';
        html += '<tr>' +
          '<td>' + esc(edt ? edt.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'}) : er.date) + '</td>' +
          '<td>' + er.median_cape + '</td>' +
          '<td>' + er.max_cape + '</td>' +
          '<td class="sv-bar-cell"><div class="sv-bar-bg">' +
            '<div class="sv-bar-fg" style="width:' + p1 + '%;background:' + pc + ';opacity:0.35"></div>' +
          '</div><span class="sv-bar-txt">' + p1 + '%</span></td>' +
          '<td>' + (er.prob_2000 != null ? er.prob_2000 + '%' : '--') + '</td>' +
        '</tr>';
      }
      html += '</tbody></table>' +
        '<div class="widget-explain" style="margin-top:8px">' + esc(ext.explain || '') +
        (ext.members_total ? ' Pooled from ' + ext.members_total + ' members across ' +
          esc((ext.centres || []).join(', ')) + '.' : '') + '</div>' +
      '</div>';
    }

    // Where the data came from — this block makes claims, so it names its sources.
    if ((conv.sources || []).length) {
      html += '<div class="chart-card">' +
        '<h3>Storm data sources</h3>' +
        '<div class="widget-explain">' +
          (conv.sources || []).map(function(s) { return '&bull; ' + esc(s); }).join('<br>') +
        '</div></div>';
    }
  }

  // ───── CHARTS ─────
  html += '<div class="section-label">Charts</div>';

  html += '<div class="chart-card">' +
    '<h3>Temperature &amp; Feels Like (24h)</h3>' +
    '<canvas id="tempChart" height="180"></canvas>' +
  '</div>';

  html += '<div class="chart-card">' +
    '<h3>Precipitation Probability (24h)</h3>' +
    '<canvas id="precipProbChart" height="140"></canvas>' +
  '</div>';

  html += '<div class="chart-card">' +
    '<h3>Precipitation Amount (24h)</h3>' +
    '<canvas id="precipChart" height="140"></canvas>' +
  '</div>';

  if (gustTimeline.length && gustTimeline.some(g => g.gust_kmh > 0)) {
    html += '<div class="chart-card">' +
      '<h3>Wind Gusts (24h)</h3>' +
      '<canvas id="gustChart" height="140"></canvas>' +
    '</div>';
  }

  // ───── SEASONAL CALENDAR ─────
  if (seasonal.available && seasonal.daily && seasonal.daily.length) {
    html += '<div class="section-label">3-Month Forecast Calendar</div>';
    html += '<div class="cal-wrap" id="seasonalCalendar"></div>';
  }

  // ───── DAYLIGHT CALENDAR ─────
  if (daylightCal.monthly && daylightCal.monthly.length) {
    html += '<div class="section-label">Yearly Daylight Calendar</div>';
    html += '<div class="chart-card">' +
      '<h3>Daylight vs. Darkness by Month</h3>' +
      '<div style="text-align:center;margin-bottom:6px;font-size:12px;color:var(--text-dim)">' +
        'Today: <strong>' + daylightCal.today_daylight + 'h</strong> of daylight, <strong>' + daylightCal.today_darkness + 'h</strong> of darkness' +
      '</div>' +
      '<div class="daylight-chart-wrap"><canvas id="daylightChart" height="200"></canvas></div>' +
      '<div class="widget-explain" style="margin-top:6px">Shows how daylight hours expand in summer and shrink in winter at your latitude (' + (d.latitude || '43.9') + '°N). The longest day (summer solstice) is in June; the shortest (winter solstice) is in December.</div>' +
    '</div>';
  }

  // ───── COLLAPSIBLE MODEL DETAILS ─────
  html += '<details class="model-details">' +
    '<summary>Model Comparison &amp; Raw Data</summary>' +
    '<div class="model-inner">' +
      '<div class="model-section-title">Weather Models Used</div>' +
      '<div>' + models.map(m => '<span class="model-chip"><span class="mn">' + esc(m) + '</span></span>').join('') + '</div>' +
      '<div class="widget-explain">Multiple independent weather models are compared. When they agree, the forecast is more reliable. Spread = how much they disagree.</div>' +
      (conf.temp_spread_6h != null ? '<div class="stat-row"><span class="stat-label">Temp spread (6h)</span><span class="stat-value">' + conf.temp_spread_6h + '°C</span></div>' : '') +
      (conf.precip_spread_6h != null ? '<div class="stat-row"><span class="stat-label">Precip spread (6h)</span><span class="stat-value">' + conf.precip_spread_6h + 'mm</span></div>' : '') +
      buildModelBars('Precipitation by model (24h)', (p24.model_totals_mm||{}), 'mm', 'var(--accent)') +
      buildModelBars('Snow by model (24h)', (p24.snow_totals_cm||{}), 'cm', 'var(--purple)') +
      '<div class="model-section-title">Wind (24h)</div>' +
      Object.entries((wind.next_24h||{}).model_max_gust_kmh||{}).map(function(e) {
        return '<span class="model-chip"><span class="mn">' + esc(e[0]) + '</span> gust ' + e[1] + ' km/h</span>';
      }).join('') +
    '</div>' +
  '</details>';

  // ───── AI BRIEFING ─────
  if (briefing) {
    html += '<div class="briefing-card">' +
      '<h3>AI Weather Briefing</h3>' +
      '<div>' + esc(briefing) + '</div>' +
    '</div>';
  }

  // ───── FOOTER ─────
  html += '<div class="footer">' +
    'WxBrief &mdash; Open-Meteo &middot; Environment Canada<br>' +
    'Not an official forecast &middot; Updated ' + fmtTimeAmPm(d.generated_at) +
  '</div>';

  app.innerHTML = html;

  // ───── RENDER CHARTS ─────
  renderTempChart(temp, hourlyComp);
  renderPrecipProbChart(precipTimeline);
  renderPrecipChart(hourlyComp);
  renderGustChart(gustTimeline);
  if (daylightCal.monthly) renderDaylightChart(daylightCal);
  if (seasonal.available && seasonal.daily) initSeasonalCalendar(seasonal);
}

// ───── CHART: Temperature + Feels Like ─────
function renderTempChart(temp, hourlyComp) {
  const canvas = document.getElementById('tempChart');
  if (!canvas) return;
  const hourlyByModel = temp.hourly_by_model || {};
  const modelNames = Object.keys(hourlyByModel);
  if (!modelNames.length) return;

  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const gridColor = isDark ? '#2a2d3a' : '#e5e7eb';
  const textColor = isDark ? '#8b8d97' : '#6b7280';
  const colors = ['#3b82f6','#16a34a','#d97706','#7c3aed','#ea580c'];

  const labels = (hourlyByModel[modelNames[0]]||[]).map(h => {
    if (!h.time) return '';
    const d = new Date(h.time);
    return fmtHour(d.getHours());
  });

  const datasets = [];
  modelNames.forEach((name, i) => {
    datasets.push({
      label: name,
      data: (hourlyByModel[name]||[]).map(h => h.temp),
      borderColor: colors[i%colors.length],
      backgroundColor: 'transparent',
      borderWidth: 2, pointRadius: 0, tension: 0.35,
    });
  });
  const feelsData = hourlyComp.slice(0,24).map(h =>
    h.feels_like && h.feels_like.available ? h.feels_like.mean : null
  );
  if (feelsData.some(v => v !== null)) {
    datasets.push({
      label: 'Feels Like',
      data: feelsData,
      borderColor: isDark ? '#f87171' : '#dc2626',
      backgroundColor: 'transparent',
      borderWidth: 1.5, borderDash: [5,4], pointRadius: 0, tension: 0.35,
    });
  }

  new Chart(canvas, {
    type: 'line', data: { labels, datasets },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: textColor, font: { size: 10 }, boxWidth: 10 } } },
      scales: {
        x: { ticks: { color: textColor, autoSkip: false, maxRotation: 45, minRotation: 45, font: { size: 9 } }, grid: { color: gridColor } },
        y: { ticks: { color: textColor, callback: v => v + '°', font: { size: 10 } }, grid: { color: gridColor } }
      }
    }
  });
}

// ───── CHART: Precip Probability ─────
function renderPrecipProbChart(timeline) {
  const canvas = document.getElementById('precipProbChart');
  if (!canvas || !timeline.length) return;

  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const gridColor = isDark ? '#2a2d3a' : '#e5e7eb';
  const textColor = isDark ? '#8b8d97' : '#6b7280';

  const labels = timeline.map(t => {
    const d = parseTime(t.time);
    return d ? fmtHour(d.getHours()) : '';
  });

  var hasSpread = timeline.some(t => t.prob_min != null);
  var datasets = [];
  if (hasSpread) {
    datasets.push({
      label: 'Model range',
      data: timeline.map(t => t.prob_max != null ? t.prob_max : t.prob),
      backgroundColor: (isDark ? '#60a5fa' : '#3b82f6') + '25',
      borderColor: 'transparent',
      borderWidth: 0, borderRadius: 2,
    });
  }
  datasets.push({
    label: 'Mean probability %',
    data: timeline.map(t => t.prob),
    backgroundColor: (isDark ? '#60a5fa' : '#3b82f6') + '80',
    borderColor: isDark ? '#60a5fa' : '#3b82f6',
    borderWidth: 1, borderRadius: 2,
  });

  new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: { legend: { display: hasSpread, labels: { color: textColor, font: { size: 9 } } } },
      scales: {
        x: { ticks: { color: textColor, autoSkip: false, maxRotation: 45, minRotation: 45, font: { size: 9 } }, grid: { color: gridColor } },
        y: { min: 0, max: 100, ticks: { color: textColor, callback: v => v + '%', font: { size: 10 } }, grid: { color: gridColor } }
      }
    }
  });
}

// ───── CHART: Precipitation Amount ─────
function renderPrecipChart(hourlyComp) {
  const canvas = document.getElementById('precipChart');
  if (!canvas) return;
  const next24 = hourlyComp.slice(0, 24);
  if (!next24.length) return;

  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const gridColor = isDark ? '#2a2d3a' : '#e5e7eb';
  const textColor = isDark ? '#8b8d97' : '#6b7280';

  const labels = next24.map(h => {
    const d = parseTime(h.time);
    return d ? fmtHour(d.getHours()) : '';
  });

  const first = next24[0].precip || {};
  const modelNames = Object.keys(first.values || {});
  const colors = ['#3b82f6','#16a34a','#d97706','#7c3aed','#ea580c'];

  const datasets = modelNames.map((name, i) => ({
    label: name,
    data: next24.map(h => ((h.precip||{}).values||{})[name]||0),
    backgroundColor: colors[i%colors.length] + '80',
    borderColor: colors[i%colors.length],
    borderWidth: 1, borderRadius: 2,
  }));

  new Chart(canvas, {
    type: 'bar', data: { labels, datasets },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: textColor, font: { size: 10 }, boxWidth: 10 } } },
      scales: {
        x: { ticks: { color: textColor, autoSkip: false, maxRotation: 45, minRotation: 45, font: { size: 9 } }, grid: { color: gridColor } },
        y: { ticks: { color: textColor, callback: v => v + 'mm', font: { size: 10 } }, grid: { color: gridColor }, beginAtZero: true }
      }
    }
  });
}

// ───── CHART: Wind Gusts ─────
function renderGustChart(timeline) {
  const canvas = document.getElementById('gustChart');
  if (!canvas || !timeline.length) return;

  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const gridColor = isDark ? '#2a2d3a' : '#e5e7eb';
  const textColor = isDark ? '#8b8d97' : '#6b7280';

  const labels = timeline.map(t => {
    const d = parseTime(t.time);
    return d ? fmtHour(d.getHours()) : '';
  });

  new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Gusts km/h',
        data: timeline.map(t => t.gust_kmh),
        borderColor: isDark ? '#fb923c' : '#ea580c',
        backgroundColor: (isDark ? '#fb923c' : '#ea580c') + '20',
        fill: true, borderWidth: 2, pointRadius: 0, tension: 0.35,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: textColor, autoSkip: false, maxRotation: 45, minRotation: 45, font: { size: 9 } }, grid: { color: gridColor } },
        y: { ticks: { color: textColor, callback: v => v + ' km/h', font: { size: 10 } }, grid: { color: gridColor }, beginAtZero: true }
      }
    }
  });
}

// ───── CHART: Daylight Calendar ─────
function renderDaylightChart(cal) {
  const canvas = document.getElementById('daylightChart');
  if (!canvas || !cal.monthly) return;

  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const gridColor = isDark ? '#2a2d3a' : '#e5e7eb';
  const textColor = isDark ? '#8b8d97' : '#6b7280';

  const labels = cal.monthly.map(m => m.month);
  const daylight = cal.monthly.map(m => m.avg_daylight);
  const darkness = cal.monthly.map(m => m.avg_darkness);

  const todayMonthIdx = new Date().getMonth();

  new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'Daylight',
          data: daylight,
          backgroundColor: daylight.map((v, i) => i === todayMonthIdx ? '#f59e0b' : (isDark ? '#fbbf2480' : '#f59e0b60')),
          borderColor: daylight.map((v, i) => i === todayMonthIdx ? '#f59e0b' : 'transparent'),
          borderWidth: daylight.map((v, i) => i === todayMonthIdx ? 2 : 0),
          borderRadius: 2,
        },
        {
          label: 'Darkness',
          data: darkness,
          backgroundColor: isDark ? '#1e293b' : '#94a3b860',
          borderRadius: 2,
        }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: textColor, font: { size: 10 }, boxWidth: 10 } } },
      scales: {
        x: { stacked: true, ticks: { color: textColor, font: { size: 10 } }, grid: { display: false } },
        y: { stacked: true, max: 24, ticks: { color: textColor, callback: v => v + 'h', font: { size: 10 } }, grid: { color: gridColor } }
      }
    }
  });
}


// ───── INTERACTIVE SEASONAL CALENDAR ─────
function initSeasonalCalendar(seasonal) {
  const wrap = document.getElementById('seasonalCalendar');
  if (!wrap || !seasonal.daily || !seasonal.daily.length) return;

  const daily = seasonal.daily;
  const byDate = {};
  daily.forEach(d => { byDate[d.date] = d; });

  // Group into months
  const months = [];
  const seen = {};
  daily.forEach(d => {
    try {
      const dt = new Date(d.date + 'T00:00:00');
      const key = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
      if (!seen[key]) {
        seen[key] = true;
        months.push({ year: dt.getFullYear(), month: dt.getMonth() });
      }
    } catch(e) {}
  });

  let currentIdx = 0;
  let selectedDate = null;

  // Temp color scale
  const allHighs = daily.map(d => d.high).filter(v => v != null);
  const tempMin = Math.min(...allHighs);
  const tempMax = Math.max(...allHighs);

  function tempColor(t) {
    if (t == null) return 'var(--card-border)';
    const ratio = (t - tempMin) / ((tempMax - tempMin) || 1);
    if (ratio < 0.25) return 'var(--accent)';
    if (ratio < 0.5) return 'var(--teal)';
    if (ratio < 0.75) return 'var(--yellow)';
    return 'var(--orange)';
  }

  function renderMonth() {
    const m = months[currentIdx];
    if (!m) return;
    const today = new Date();
    const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
    const monthName = new Date(m.year, m.month, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const firstDay = new Date(m.year, m.month, 1).getDay();
    const daysInMonth = new Date(m.year, m.month + 1, 0).getDate();

    let h = '<div class="cal-nav">' +
      '<button class="cal-nav-btn" id="calPrev"' + (currentIdx === 0 ? ' disabled' : '') + '>&larr;</button>' +
      '<div class="cal-month-title">' + esc(monthName) + '</div>' +
      '<button class="cal-nav-btn" id="calNext"' + (currentIdx >= months.length - 1 ? ' disabled' : '') + '>&rarr;</button>' +
    '</div>';

    h += '<div class="cal-grid">';
    var dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    dayNames.forEach(d => { h += '<div class="cal-header">' + d + '</div>'; });

    for (var e = 0; e < firstDay; e++) {
      h += '<div class="cal-day-empty"></div>';
    }

    for (var day = 1; day <= daysInMonth; day++) {
      var dateStr = m.year + '-' + String(m.month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      var dd = byDate[dateStr];
      var isToday = dateStr === todayStr;
      var isSel = dateStr === selectedDate;
      var cls = 'cal-day' + (isToday ? ' today' : '') + (isSel ? ' selected' : '');
      var bg = dd && dd.high != null ? tempColor(dd.high) : 'var(--card-border)';
      var hasPrecip = dd && dd.precip_mm != null && dd.precip_mm > 1;

      h += '<div class="' + cls + '" data-date="' + dateStr + '" style="background:' + bg + '20">' +
        '<div class="cal-d">' + day + '</div>';
      if (dd && dd.high != null) {
        h += '<div class="cal-hi">' + Math.round(dd.high) + '°</div>';
      }
      if (hasPrecip) {
        h += '<div style="font-size:8px;color:var(--accent);font-weight:700;line-height:1">' + Math.round(dd.precip_mm) + 'mm</div>';
      }
      h += '</div>';
    }
    h += '</div>';

    // Legend
    h += '<div style="display:flex;gap:12px;justify-content:center;margin:8px 0;font-size:10px;color:var(--text-dim)">' +
      '<span>🟡 Today</span>' +
      '<span style="color:var(--red)">Red = High temp</span>' +
      '<span style="color:var(--accent)">Blue mm = Rain expected</span>' +
      '<span>Tap a day for details</span>' +
    '</div>';

    // Detail panel
    if (selectedDate && byDate[selectedDate]) {
      var sd = byDate[selectedDate];
      var dt = new Date(selectedDate + 'T00:00:00');
      var dayFull = dt.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      h += '<div class="cal-detail">' +
        '<div class="cal-detail-title">' + esc(dayFull) + '</div>' +
        '<div class="cal-detail-grid">' +
          '<div class="cal-detail-item"><div class="cal-detail-label">High</div><div class="cal-detail-val" style="color:var(--red)">' + (sd.high != null ? Math.round(sd.high) + '°C' : '--') + '</div></div>' +
          '<div class="cal-detail-item"><div class="cal-detail-label">Low</div><div class="cal-detail-val" style="color:var(--accent)">' + (sd.low != null ? Math.round(sd.low) + '°C' : '--') + '</div></div>' +
          '<div class="cal-detail-item"><div class="cal-detail-label">Avg Temperature</div><div class="cal-detail-val">' + (sd.mean != null ? Math.round(sd.mean) + '°C' : '--') + '</div></div>' +
          '<div class="cal-detail-item"><div class="cal-detail-label">Precipitation</div><div class="cal-detail-val" style="color:var(--accent)">' + (sd.precip_mm != null ? sd.precip_mm + ' mm' : '0 mm') + '</div></div>' +
        '</div>' +
        '<div class="widget-explain" style="margin-top:8px">Long-range seasonal forecast from ECMWF SEAS5 model. Accuracy decreases further into the future — treat as a general trend, not a precise prediction.</div>' +
      '</div>';
    } else {
      h += '<div style="text-align:center;padding:12px 0;font-size:12px;color:var(--text-dim)">Tap any day to see its forecast details</div>';
    }

    wrap.innerHTML = h;

    // Attach events
    document.getElementById('calPrev').addEventListener('click', function() {
      if (currentIdx > 0) { currentIdx--; selectedDate = null; renderMonth(); }
    });
    document.getElementById('calNext').addEventListener('click', function() {
      if (currentIdx < months.length - 1) { currentIdx++; selectedDate = null; renderMonth(); }
    });
    wrap.querySelectorAll('.cal-day').forEach(function(el) {
      el.addEventListener('click', function() {
        selectedDate = this.getAttribute('data-date');
        renderMonth();
      });
    });
  }

  renderMonth();
}

// ───── HELPERS ─────
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function parseTime(iso) {
  if (!iso) return null;
  try { return new Date(iso); } catch(e) { return null; }
}

function fmtTimeAmPm(iso) {
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit', hour12:true });
  } catch(e) { return iso; }
}

function fmtHour(h) {
  if (h == null) return '';
  const ampm = h >= 12 ? 'PM' : 'AM';
  const hr = h % 12 || 12;
  return hr + ' ' + ampm;
}

function fmtShortTime(iso) {
  if (!iso) return '--';
  try { return new Date(iso).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', hour12:true }); } catch(e) { return iso; }
}

// Turns a list of hourly map frames (each carrying .time_local, the first
// one always "Now") into two label sets:
//   .big  — the exact time for that one step, shown in the frame badge as
//           you move through the carousel one hour at a time, so you are
//           never guessing what "+5" meant.
//   .tick — a sparser label for the slider rail itself. Printing all 49
//           hour labels in one row would just overlap into noise, so only
//           every `tickEvery` hours (plus the first and last) get text;
//           the rest render as a small mark (see .tick-minor in CSS) so the
//           rail still visibly has 49 individual steps to land on.
// Uses the same "TODAY / 4 PM" day-crossing convention as the Hourly
// Forecast scroller above, so a step into tomorrow reads as "Wed 2 AM"
// instead of silently rolling over from "11 PM" to "12 AM".
function buildFrameLabels(frames, tickEvery) {
  var nowD = new Date();
  var lastDayShown = nowD.getDate();
  return frames.map(function(f, i) {
    var t = parseTime(f.time_local);
    var hr = t ? t.getHours() : 0;
    var tDate = t ? t.getDate() : nowD.getDate();
    var isNewDay = tDate !== lastDayShown && i > 0;
    var big;
    if (i === 0) {
      big = 'Now';
    } else {
      big = fmtHour(hr);
      if (isNewDay) {
        var tomorrow = new Date(nowD); tomorrow.setDate(nowD.getDate() + 1);
        var dayWord = (t && t.getDate() === tomorrow.getDate() && t.getMonth() === tomorrow.getMonth())
          ? 'Tmrw' : (t ? t.toLocaleDateString('en-US', { weekday: 'short' }) : '');
        big = (dayWord + ' ' + big).trim();
        lastDayShown = tDate;
      }
    }
    var showTick = i === 0 || i === frames.length - 1 ||
      (typeof f.hour === 'number' && f.hour % tickEvery === 0);
    return { big: big, tick: showTick ? (i === 0 ? 'Now' : fmtHour(hr)) : '' };
  });
}

function dirToDeg(dir) {
  const map = {N:0,NNE:22.5,NE:45,ENE:67.5,E:90,ESE:112.5,SE:135,SSE:157.5,S:180,SSW:202.5,SW:225,WSW:247.5,W:270,WNW:292.5,NW:315,NNW:337.5};
  return map[(dir||'').toUpperCase()] ?? null;
}

function degToDir(deg) {
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(((deg%360)+360)%360/22.5)%16];
}

function uvCategory(uv) {
  if (uv == null) return '';
  if (uv <= 2) return 'Low — no sun protection needed';
  if (uv <= 5) return 'Moderate — wear sunscreen outdoors';
  if (uv <= 7) return 'High — reduce midday sun exposure';
  if (uv <= 10) return 'Very high — extra protection needed';
  return 'Extreme — avoid being outside';
}

function compassDir(deg) {
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(((deg % 360) / 22.5)) % 16];
}

function visibilityTip(km) {
  if (km == null) return '';
  if (km >= 10) return 'Excellent visibility — clear conditions';
  if (km >= 4) return 'Good visibility';
  if (km >= 1) return 'Reduced — drive with caution';
  return 'Very poor — use extreme caution driving';
}

function pressureTrend(trend) {
  if (!trend) return 'Trend data not available';
  const map = { rising: '↑ Rising — clearing skies likely', falling: '↓ Falling — weather change possible', steady: '→ Steady — current conditions will persist' };
  return map[trend] || trend;
}

function aqiToColor(aqi) {
  if (aqi == null) return 'var(--text-dim)';
  if (aqi <= 50) return 'var(--green)';
  if (aqi <= 100) return 'var(--yellow)';
  if (aqi <= 150) return 'var(--orange)';
  return 'var(--red)';
}

function formatPollutant(p) {
  const map = { pm2_5:'PM2.5 (fine particles)', pm10:'PM10 (coarse particles)', ozone:'Ozone', nitrogen_dioxide:'Nitrogen Dioxide', sulphur_dioxide:'Sulphur Dioxide', carbon_monoxide:'Carbon Monoxide' };
  return map[p] || p;
}

function fmtOccurrence(occ) {
  const map = { none:'None expected', all_agree_yes:'All models agree', most_say_yes:'Most models agree', minority_say_yes:'Some models show' };
  return map[occ] || occ || '--';
}

function explainOccurrence(occ) {
  const map = { all_agree_yes:'all weather models predict precipitation — high confidence', most_say_yes:'most weather models predict precipitation', minority_say_yes:'only some models show it — lower confidence', none:'no models predict precipitation' };
  return map[occ] || 'uncertain';
}

function avgPrecip(p) {
  const totals = Object.values(p.model_totals_mm || {});
  if (!totals.length) return '--';
  return (totals.reduce((a,b) => a+b, 0) / totals.length).toFixed(1);
}

function buildSunArc(sun) {
  const rise = sun.sunrise ? fmtShortTime(sun.sunrise) : '--';
  const set = sun.sunset ? fmtShortTime(sun.sunset) : '--';

  let progress = 0.5;
  if (sun.sunrise && sun.sunset) {
    const now = Date.now();
    const riseT = new Date(sun.sunrise).getTime();
    const setT = new Date(sun.sunset).getTime();
    if (now < riseT) progress = 0;
    else if (now > setT) progress = 1;
    else progress = (now - riseT) / (setT - riseT);
  }

  const angle = Math.PI - progress * Math.PI;
  const cx = 80 + 55 * Math.cos(angle);
  const cy = 65 - 50 * Math.sin(angle);

  return '<div class="sun-arc-wrap">' +
    '<svg viewBox="0 0 160 75" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M 25 65 A 55 50 0 0 1 135 65" stroke="var(--card-border)" stroke-width="3" fill="none"/>' +
      '<path d="M 25 65 A 55 50 0 0 1 135 65" stroke="var(--yellow)" stroke-width="3" fill="none" stroke-dasharray="' + (progress*173).toFixed(0) + ' 173"/>' +
      '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="5" fill="var(--yellow)"/>' +
      '<line x1="25" y1="65" x2="135" y2="65" stroke="var(--card-border)" stroke-width="1"/>' +
    '</svg>' +
    '<div class="sun-time-row"><span>↑ ' + rise + '</span><span>↓ ' + set + '</span></div>' +
  '</div>';
}

// Shared basemap + city-label SVG builder, used by the radar carousel and
// the temperature/snowfall maps so all three line up visually and share
// one implementation of the region/shoreline/city overlay.
//
// opts.boundariesOnTop: when the widget paints a full-canvas color wash
// (the temperature heatmap), region outlines/labels/shoreline need to be
// drawn in a separate layer ON TOP of that color, not underneath it, or
// they wash out. Returned as `midSvg`, meant to sit between the color
// layer and the city-label layer (z-index 3, see .radar-svg-mid).
//
// opts.showValues + opts.idPrefix: gives each city's <text> a predictable
// id (idPrefix + 'CityLabel' + index) and reserves extra label width, so
// the per-frame carousel code can push a live value (e.g. "Barrie -3°")
// into that same text node without rebuilding the SVG.
function buildMapOverlay(bbox, w, h, geo, locationName, opts) {
  opts = opts || {};
  var lonSpan = bbox.lon_max - bbox.lon_min;
  var latSpan = bbox.lat_max - bbox.lat_min;
  function toX(lon) { return ((lon - bbox.lon_min) / lonSpan * w).toFixed(1); }
  function toY(lat) { return ((1 - (lat - bbox.lat_min) / latSpan) * h).toFixed(1); }

  var shore = geo.shoreline || [];

  // --- SVG base: grid lines + lake mask only — sits under any color wash
  // (radar image / temperature canvas), so it must not carry anything
  // that needs to stay legible. Region/shoreline outlines go in midSvg
  // instead, drawn ON TOP of that color layer. ---
  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" class="radar-svg-base">';
  for (var lat = Math.ceil(bbox.lat_min); lat <= bbox.lat_max; lat += 0.5) {
    svg += '<line x1="0" y1="' + toY(lat) + '" x2="' + w + '" y2="' + toY(lat) + '" stroke="#1a1f30" stroke-width="0.5"/>';
  }
  for (var lon = Math.ceil(bbox.lon_min); lon <= bbox.lon_max; lon += 0.5) {
    svg += '<line x1="' + toX(lon) + '" y1="0" x2="' + toX(lon) + '" y2="' + h + '" stroke="#1a1f30" stroke-width="0.5"/>';
  }
  if (shore.length > 2) {
    var path = 'M' + toX(shore[0].lon) + ',' + toY(shore[0].lat);
    for (var i = 1; i < shore.length; i++) { path += ' L' + toX(shore[i].lon) + ',' + toY(shore[i].lat); }
    path += ' L' + w + ',' + h + ' L0,' + h + ' Z';
    svg += '<path d="' + path + '" fill="#040a14" stroke="none"/>';
  }
  svg += '</svg>';

  // --- SVG mid layer: region/shoreline outlines drawn ON TOP of the color
  // layer (radar image or heatmap canvas), so they stay legible instead of
  // washing out underneath it.
  //
  // Every line gets a light halo drawn first, same idea as the text labels'
  // paint-order stroke below. Without it, a dark navy line reads fine on the
  // bright temperature/snow color wash but is nearly invisible on the radar
  // map, whose background is close to black — the boundaries "disappear" on
  // that one map while looking normal on the other two. The halo makes every
  // line visible against any background, dark or light. ---
  var midSvg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" class="radar-svg-mid">';
  (geo.regions || []).forEach(function(r) {
    var pts = r.outline;
    if (pts.length >= 3) {
      var rp = 'M' + toX(pts[0].lon) + ',' + toY(pts[0].lat);
      for (var i = 1; i < pts.length; i++) { rp += ' L' + toX(pts[i].lon) + ',' + toY(pts[i].lat); }
      rp += ' Z';
      midSvg += '<path d="' + rp + '" fill="none" stroke="#f0f3fa" stroke-width="3.4" stroke-dasharray="6,3" opacity="0.55"/>';
      midSvg += '<path d="' + rp + '" fill="none" stroke="#0b0f1a" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.85"/>';
    }
  });
  (geo.region_labels || []).forEach(function(r) {
    midSvg += '<text x="' + toX(r.lon) + '" y="' + toY(r.lat) + '" fill="#0b0f1a" font-size="10" font-weight="800" ' +
      'font-family="Inter,sans-serif" text-anchor="middle" paint-order="stroke" stroke="#f0f3fa" stroke-width="3">' +
      esc(r.name) + '</text>';
  });
  if (shore.length > 2) {
    var sp2 = 'M' + toX(shore[0].lon) + ',' + toY(shore[0].lat);
    for (var i = 1; i < shore.length; i++) { sp2 += ' L' + toX(shore[i].lon) + ',' + toY(shore[i].lat); }
    midSvg += '<path d="' + sp2 + '" fill="none" stroke="#f0f3fa" stroke-width="4.2" opacity="0.6"/>';
    midSvg += '<path d="' + sp2 + '" fill="none" stroke="#0b1f3a" stroke-width="2"/>';
    var lakeX2 = toX((bbox.lon_min + bbox.lon_max) / 2);
    var lakeY2 = toY(bbox.lat_min + (latSpan * 0.12));
    midSvg += '<text x="' + lakeX2 + '" y="' + lakeY2 + '" fill="#0b1f3a" font-size="13" font-weight="700" ' +
      'font-family="Inter,sans-serif" text-anchor="middle" font-style="italic" paint-order="stroke" stroke="#f0f3fa" stroke-width="2.5">Lake Ontario</text>';
  }
  midSvg += '</svg>';

  // --- SVG city labels: solid pill boxes (not a text halo) so names stay
  // legible over a full-canvas color wash instead of blurring into it. ---
  var labelSvg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" class="radar-svg-labels">';
  var cities = geo.cities || [];
  var targetCity = locationName.split(',')[0].trim().toLowerCase();
  var valueRoom = opts.showValues ? 5 : 0; // reserve chars for " -30°"

  // Draw the target city's label last (so it always paints on top of any
  // nearby city's box — e.g. Oshawa sits close enough to Bowmanville that
  // whichever renders second would otherwise occlude the other's text).
  var targetIdx = -1;
  cities.forEach(function(c, ci) { if (c.name.toLowerCase() === targetCity) targetIdx = ci; });
  var drawOrder = cities.map(function(c, ci) { return ci; });
  if (targetIdx >= 0) {
    drawOrder = drawOrder.filter(function(ci) { return ci !== targetIdx; });
    drawOrder.push(targetIdx);
  }

  drawOrder.forEach(function(ci) {
    var c = cities[ci];
    var cx = parseFloat(toX(c.lon));
    var cy = parseFloat(toY(c.lat));
    var isTarget = ci === targetIdx;
    var idAttr = (opts.idPrefix ? ' id="' + opts.idPrefix + 'CityLabel' + ci + '"' : '');

    if (isTarget) {
      labelSvg += '<circle cx="' + cx + '" cy="' + cy + '" r="14" stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.5">' +
        '<animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite"/>' +
        '<animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/></circle>';
      labelSvg += '<circle cx="' + cx + '" cy="' + cy + '" r="4" fill="#60a5fa"/>';
      labelSvg += '<line x1="' + (cx-18) + '" y1="' + cy + '" x2="' + (cx-6) + '" y2="' + cy + '" stroke="#60a5fa" stroke-width="1.5"/>';
      labelSvg += '<line x1="' + (cx+6) + '" y1="' + cy + '" x2="' + (cx+18) + '" y2="' + cy + '" stroke="#60a5fa" stroke-width="1.5"/>';
      labelSvg += '<line x1="' + cx + '" y1="' + (cy-18) + '" x2="' + cx + '" y2="' + (cy-6) + '" stroke="#60a5fa" stroke-width="1.5"/>';
      labelSvg += '<line x1="' + cx + '" y1="' + (cy+6) + '" x2="' + cx + '" y2="' + (cy+18) + '" stroke="#60a5fa" stroke-width="1.5"/>';
      // Placed below the crosshair (not beside it) so it doesn't sit on
      // top of whichever neighboring city happens to be nearby — the
      // crosshair itself already pinpoints the exact location.
      var targetValueRoom = (opts.showValues || opts.showTargetValue) ? 9 : 0; // room for " 99.9mm/h"/" -30°"
      var targetIdAttr = (opts.showTargetValue && opts.idPrefix) ? ' id="' + opts.idPrefix + 'TargetLabel"' : idAttr;
      var tBoxW = Math.round((c.name.length + targetValueRoom) * 7.4 + 16);
      var tBoxX = cx - tBoxW / 2, tBoxY = cy + 21;
      labelSvg += '<rect x="' + tBoxX + '" y="' + tBoxY + '" width="' + tBoxW + '" height="24" rx="5" fill="#0b0f1a" fill-opacity="0.92" stroke="#3b6df0" stroke-width="1.2"/>';
      labelSvg += '<text' + targetIdAttr + ' x="' + cx + '" y="' + (tBoxY+17) + '" fill="#8fbdff" font-size="15" font-weight="800" font-family="Inter,sans-serif" text-anchor="middle">' + esc(c.name) + '</text>';
    } else {
      var major = c.major;
      var fontSize = major ? 12 : 10.5;
      var charW = major ? 6.9 : 6.0;
      var dotR = major ? 3 : 2;
      var boxW = Math.round((c.name.length + valueRoom) * charW + 14);
      var boxH = major ? 19 : 16;
      var boxX = cx + dotR + 4;
      var boxY = cy - boxH / 2 - (major ? 1 : 0);
      labelSvg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + dotR + '" fill="' + (major ? '#dfe6f5' : '#9aa6bc') + '"/>';
      labelSvg += '<rect x="' + boxX + '" y="' + boxY + '" width="' + boxW + '" height="' + boxH + '" rx="4" ' +
        'fill="#0b0f1a" fill-opacity="0.86" stroke="' + (major ? '#3a4666' : '#2a3550') + '" stroke-width="1"/>';
      labelSvg += '<text' + idAttr + ' x="' + (boxX+7) + '" y="' + (boxY+boxH-5) + '" ' +
        'fill="' + (major ? '#e6ebf7' : '#b6c0d4') + '" font-size="' + fontSize + '" font-weight="' + (major ? '700' : '600') + '" ' +
        'font-family="Inter,sans-serif">' + esc(c.name) + '</text>';
    }
  });
  labelSvg += '</svg>';

  return { toX: toX, toY: toY, baseSvg: svg, midSvg: midSvg, labelSvg: labelSvg };
}

// Which frame indices fall inside the active severe-storm alert's time
// window, so the radar map can flag them directly instead of just looking
// like a mild rain forecast that happens to disagree with a scary banner
// higher up the page. Matched on local calendar date + hour-of-day against
// alert.date / alert.window (both computed by the same convective engine
// that issued the alert, so "inside the window" here means exactly what it
// means up there).
function framesInAlertWindow(frames, alertInfo) {
  if (!alertInfo || !alertInfo.active || !alertInfo.window) return frames.map(function() { return false; });
  var win = alertInfo.window;
  return frames.map(function(f) {
    var t = parseTime(f.time_local);
    if (!t) return false;
    var dateStr = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
    if (dateStr !== alertInfo.date) return false;
    var hr = t.getHours();
    return hr >= win.start_hour && hr <= win.end_hour;
  });
}

function buildRadarCarousel(radar, locationName, alertInfo) {
  var bbox = radar.bbox;

  var frameLabels = buildFrameLabels(frames, 6);

      '<span class="radar-frame-label" id="radarFrameLabel">' + esc(frameLabels[0].big) + '</span>' +

  // Time slider
  html += '<div class="radar-slider-wrap">';

  for (var fi = 0; fi < frames.length; fi++) {
    var flbl = frameLabels[fi];
    html += '<span class="' + (fi === 0 ? 'active' : '') + (flbl.tick ? '' : ' tick-minor') +
      (inAlertWindow[fi] ? ' tick-severe' : '') +

  html += '</div>';

  html += '</div>';

  // Numeric precip readout for the selected frame — actual mm/cm, not just color
  html += '<div id="radarSevereNote"></div>';
  html += '<div class="radar-precip-readout" id="radarPrecipReadout"></div>';

  // Zoomable map container
  html += '<div class="radar-zoom-wrap" id="radarZoomWrap">';
  html += '<div class="radar-container" id="radarContainer">';
  html += svg;
  for (var fi = 0; fi < frames.length; fi++) {
    html += '<img src="data:image/png;base64,' + frames[fi].image_base64 + '" class="radar-frame-img' +
      (fi === 0 ? ' active' : '') + '" data-frame="' + fi + '" alt="' + esc(frames[fi].label) + '"/>';
  }
  html += midSvg;
  html += labelSvg;
  html += '</div></div>';

  // Legend - a compact horizontal gradient bar with labels, styled to match
  // the rest of the dashboard. EC's GetLegendGraphic image is a tall vertical
  // strip (~124x413px) that looks out of place rendered at native aspect
  // ratio in a horizontal panel, so it's intentionally not used here.
  var precipWord = isSnow ? 'snow' : 'rain';
  html += '<div id="radarLegendBlock">';
  // Radar legend (frame 0)
  html += '<div class="radar-legend-section" id="legendRadar">';
  html += '<div class="radar-legend"><div class="radar-legend-bar"></div></div>';
  html += '<div class="radar-legend-labels"><span>Very light</span><span>Light</span><span>Moderate</span><span>Heavy</span><span>Intense</span></div>';
  html += '<div class="radar-explain">' +
    'Live radar showing where ' + precipWord + ' is falling <strong style="color:#8898b0">right now</strong>, straight from Environment Canada\'s own color scale.' +
  '</div></div>';
  // Forecast legend
  html += '<div class="radar-legend-section" id="legendForecast" style="display:none">';
  html += '<div class="radar-legend"><div class="radar-legend-bar" style="background:linear-gradient(90deg,#0a1a40 0%,#1a3a80 15%,#00a0c0 30%,#60d0a0 42%,#e0e040 55%,#f0a020 68%,#e04020 80%,#c01060 90%,#ff40c0 100%)"></div></div>';
  html += '<div class="radar-legend-labels"><span>0%</span><span>20%</span><span>40%</span><span>60%</span><span>80%</span><span>100%</span></div>';
  html += '<div class="radar-explain">' +
    'HRDPS forecast: <strong style="color:#8898b0">probability of ' + precipWord + '</strong> at the selected time, EC\'s own color scale.' +
  '</div></div>';
  html += '</div>';

  html += '</div>';

  window.__radarMeta = {
    count: frames.length,
    labels: frameLabels.map(function(f){ return f.big }),
    inAlertWindow: inAlertWindow,
