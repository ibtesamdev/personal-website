    '</div>';
  }

  // W6: Humidity + Dewpoint Comfort
  const humVal = current.humidity ?? (hourlyComp.length && hourlyComp[0].humidity && hourlyComp[0].humidity.available ? Math.round(hourlyComp[0].humidity.mean) : null);
  if (humVal != null || (dewComfort && dewComfort.available)) {
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">💧</span> Humidity</div>';
    if (humVal != null) {
      html += '<div class="widget-value">' + humVal + '<span class="widget-unit">%</span></div>';
    }
    if (dewComfort.available) {
      html += '<div class="widget-sub" style="font-weight:600;color:' +
        (dewComfort.comfort === 'Dry' || dewComfort.comfort === 'Comfortable' ? 'var(--green)' :
         dewComfort.comfort === 'Slightly muggy' ? 'var(--yellow)' : 'var(--red)') + '">' +
        esc(dewComfort.comfort) + ' (Dewpoint ' + dewComfort.dewpoint + '°)</div>';
      html += '<div class="widget-explain">' + esc(dewComfort.description) + '</div>';
    } else {
      const dp = current.dewpoint;
      if (dp != null) html += '<div class="widget-sub">Dewpoint: ' + dp + '°</div>';
      html += '<div class="widget-explain">Humidity is how much moisture is in the air. Higher humidity makes hot days feel hotter and slows sweat evaporation.</div>';
    }
    html += '</div>';
  }

  // W7: UV Index
  const curUV = hourlyComp.length && hourlyComp[0].uv && hourlyComp[0].uv.available ? Math.round(hourlyComp[0].uv.mean) : null;
  if (curUV != null) {
    const uvLevel = uvCategory(curUV);
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">☀️</span> UV Index</div>' +
      '<div class="widget-value">' + curUV + '</div>' +
      '<div class="uv-bar"><div class="uv-marker" style="left:' + Math.min((curUV/11)*100,100) + '%"></div></div>' +
      '<div class="widget-sub">' + esc(uvLevel) + '</div>' +
      '<div class="widget-explain">UV measures sun radiation intensity. Apply SPF 30+ when UV is 3 or above. Peak UV is usually between 11 AM and 3 PM.</div>' +
    '</div>';
  }

  // W8: Visibility
  const visVal = current.visibility ?? (hourlyComp.length && hourlyComp[0].visibility && hourlyComp[0].visibility.available ? Math.round(hourlyComp[0].visibility.mean / 1000) : null);
  if (visVal != null) {
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">👁️</span> Visibility</div>' +
      '<div class="widget-value">' + visVal + '<span class="widget-unit"> km</span></div>' +
      '<div class="widget-sub">' + visibilityTip(visVal) + '</div>' +
      '<div class="widget-explain">How far you can see clearly. Fog, rain, and snow reduce visibility. Under 1 km means driving hazard.</div>' +
    '</div>';
  }

  // W9: Pressure
  const pressureVal = current.pressure ?? (hourlyComp.length && hourlyComp[0].pressure && hourlyComp[0].pressure.available ? Math.round(hourlyComp[0].pressure.mean * 10) / 10 : null);
  if (pressureVal != null) {
    const pressureDisplay = pressureVal > 900 ? (pressureVal / 10).toFixed(1) : pressureVal;
    const pressureUnit = 'kPa';
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">📊</span> Pressure</div>' +
      '<div class="widget-value" style="font-size:22px">' + pressureDisplay + '<span class="widget-unit"> ' + pressureUnit + '</span></div>' +
      '<div class="widget-sub">' + pressureTrend(current.pressure_trend) + '</div>' +
      '<div class="widget-explain">Atmospheric pressure. Rising pressure usually means clearing skies. Falling pressure often brings clouds and rain.</div>' +
    '</div>';
  }

  // W10: Cloud Cover
  if (cloud.available) {
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">☁️</span> Cloud Cover</div>' +
      '<div class="widget-value">' + cloud.current_pct + '<span class="widget-unit">%</span></div>' +
      '<div class="widget-sub" style="font-weight:600">' + esc(cloud.description) + '</div>' +
      '<div class="widget-explain">Trend: ' + esc(cloud.trend) + ' over the next 6 hours (avg ' + cloud.avg_6h_pct + '%).</div>' +
    '</div>';
  }

  // W11: Sunrise / Sunset
  if (sun.available) {
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">🌅</span> Sun</div>' +
      buildSunArc(sun) +
      (sun.daylight_hours ? '<div class="widget-explain">' + sun.daylight_hours + ' hours of daylight today.</div>' : '') +
    '</div>';
  }

  // W12: Moon Phase
  html += '<div class="widget">' +
    '<div class="widget-label"><span class="wl-icon">🌙</span> Moon</div>' +
    '<div style="text-align:center;margin:4px 0">' +
      '<div style="font-size:32px;line-height:1">' + (moon.icon || '\u{1F311}') + '</div>' +
      '<div style="font-size:13px;font-weight:600;margin-top:4px">' + esc(moon.phase_name || 'Unknown') + '</div>' +
    '</div>' +
    (moon.illumination_pct != null ? '<div class="widget-sub" style="text-align:center">' + moon.illumination_pct + '% illuminated</div>' : '') +
    '<div class="widget-explain">The moon goes through an approximately 29.5-day cycle from new moon to full moon and back.</div>' +
  '</div>';

  // W13: Wind (moved down — user prioritizes AQI over wind)
  const modelWind = hourlyComp.length && hourlyComp[0].wind_speed && hourlyComp[0].wind_speed.available ? Math.round(hourlyComp[0].wind_speed.mean) : null;
  const modelGust = hourlyComp.length && hourlyComp[0].wind_gust && hourlyComp[0].wind_gust.available ? Math.round(hourlyComp[0].wind_gust.mean) : null;
  const modelDir = hourlyComp.length && hourlyComp[0].wind_dir && hourlyComp[0].wind_dir.available ? Math.round(hourlyComp[0].wind_dir.mean) : null;
  const curWind = current.wind_speed ?? modelWind;
  const curGust = current.wind_gust ?? modelGust;
  const curDir = current.wind_direction || (modelDir != null ? degToDir(modelDir) : '');
  const dirDeg = dirToDeg(curDir) ?? modelDir;

  if (curWind != null) {
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">💨</span> Wind</div>' +
      '<div class="wind-compass">' +
        '<span class="wind-n">N</span><span class="wind-e">E</span><span class="wind-s">S</span><span class="wind-w">W</span>' +
        (dirDeg != null ? '<div class="wind-arrow" style="transform:rotate(' + dirDeg + 'deg)"></div>' : '') +
      '</div>' +
      '<div style="text-align:center">' +
        '<div class="widget-value" style="font-size:20px">' + curWind + ' <span class="widget-unit">km/h ' + esc(curDir) + '</span></div>' +
        (curGust ? '<div class="widget-sub" style="color:' + (curGust >= 90 ? 'var(--red)' : curGust >= 70 ? '#e09522' : curGust >= 40 ? 'var(--yellow)' : 'var(--text-secondary)') + ';font-weight:' + (curGust >= 70 ? '700' : '500') + '">Gusts ' + curGust + ' km/h' + (curGust >= 90 ? ' ⚠️' : curGust >= 70 ? ' ⚠' : '') + '</div>' : '') +
      '</div>' +
      '<div class="widget-explain">Wind direction shows where the wind is coming FROM. Gusts are brief bursts faster than the sustained speed.</div>' +
    '</div>';
  }

  // W14b: Freezing Level
  if (freezeLevel && freezeLevel.height_m != null) {
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">🏔️</span> Freezing Level</div>' +
      '<div class="widget-value" style="font-size:22px">' + Math.round(freezeLevel.height_m) + '<span class="widget-unit"> m</span></div>' +
      '<div class="widget-sub">' + esc(freezeLevel.description || '') + '</div>' +
      '<div class="widget-explain">Height where temperature reaches 0°C. Below this altitude, precipitation falls as rain; above it, as snow or ice.</div>' +
    '</div>';
  }

  // W15: Precipitation (24h)
  const p24 = precip.next_24h || {};
  if (p24.available && p24.occurrence !== 'none') {
    html += '<div class="widget wide">' +
      '<div class="widget-label"><span class="wl-icon">🌧️</span> Precipitation (Next 24h)</div>' +
      '<div style="display:flex;gap:16px;align-items:baseline;margin:4px 0">' +
        '<div class="widget-value">' + avgPrecip(p24) + '<span class="widget-unit"> mm</span></div>' +
        '<div style="font-size:12px;color:var(--text-dim)">' + fmtOccurrence(p24.occurrence) + ' · ' + esc(p24.precip_type||'') + '</div>' +
      '</div>' +
      '<div class="widget-explain">Total precipitation expected across all weather models in the next 24 hours. "' + fmtOccurrence(p24.occurrence) + '" means ' + explainOccurrence(p24.occurrence) + '.</div>' +
    '</div>';
  }

  // W17: Snow Depth
  if (snowDepth.available) {
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">🏔️</span> Snow Depth</div>' +
      '<div class="widget-value">' + snowDepth.depth_cm + '<span class="widget-unit"> cm</span></div>' +
      '<div class="widget-sub">Current snow on the ground.</div>' +
    '</div>';
  }

  // W19: Lake Conditions (Marine)
  const marineHourly = (d.marine && d.marine.hourly) || [];
  const marineNow = marineHourly.length ? marineHourly.reduce(function(closest, rec) {
    const t = parseTime(rec.time);
    if (!t) return closest;
    const diff = Math.abs(t - new Date());
    return (!closest || diff < closest._diff) ? Object.assign({_diff: diff}, rec) : closest;
  }, null) : null;
  if (marineNow && marineNow.wave_height != null) {
    const waveM = marineNow.wave_height;
    const waveDir = marineNow.wave_direction;
    const wavePeriod = marineNow.wave_period;
    const waveLevel = waveM < 0.3 ? ['Calm','var(--green)'] : waveM < 0.6 ? ['Light chop','var(--green)'] :
      waveM < 1.2 ? ['Moderate','var(--yellow)'] : waveM < 2.0 ? ['Rough','var(--orange)'] : ['Very rough','var(--red)'];
    html += '<div class="widget">' +
      '<div class="widget-label"><span class="wl-icon">🌊</span> Lake Conditions</div>' +
      '<div class="widget-value">' + waveM.toFixed(1) + '<span class="widget-unit"> m waves</span></div>' +
      '<div class="widget-sub" style="font-weight:600;color:' + waveLevel[1] + '">' + waveLevel[0] +
        (wavePeriod != null ? ' · ' + Math.round(wavePeriod) + 's period' : '') +
        (waveDir != null ? ' · ' + compassDir(waveDir) : '') + '</div>' +
      '<div class="widget-explain">Lake Ontario wave height and period. Higher waves and shorter periods mean choppier conditions for boating or shoreline activity.</div>' +
    '</div>';
  }

  // W18: Forecast Confidence
  html += '<div class="widget">' +
    '<div class="widget-label"><span class="wl-icon">🎯</span> Forecast Confidence</div>' +
    '<div style="margin:4px 0">' +
      '<div class="stat-row"><span class="stat-label">Next 6h</span>' +
        '<span class="confidence-badge confidence-' + (conf.next_6h||'unknown') + '">' + (conf.next_6h||'?') + '</span></div>' +
      '<div class="stat-row"><span class="stat-label">Next 24h</span>' +
        '<span class="confidence-badge confidence-' + (conf.next_24h||'unknown') + '">' + (conf.next_24h||'?') + '</span></div>' +
    '</div>' +
    '<div class="widget-explain">When multiple weather models agree, confidence is high. Large disagreements between models mean more uncertainty.</div>' +
  '</div>';

  html += '</div>'; // end widget-grid

  // ───── CHARTS ─────
  html += '<div class="section-label">Charts</div>';

  html += '<div class="chart-card">' +
    '<h3>Temperature &amp; Feels Like (24h)</h3>' +
    '<canvas id="tempChart" height="180"></canvas>' +
  '</div>';

  html += '<div class="chart-card">' +
    '<h3>Precipitation Probability (24h)</h3>' +
    '<canvas id="precipProbChart" height="140"></canvas>' +
  '</div>';

  html += '<div class="chart-card">' +
    '<h3>Precipitation Amount (24h)</h3>' +
    '<canvas id="precipChart" height="140"></canvas>' +
  '</div>';

  if (gustTimeline.length && gustTimeline.some(g => g.gust_kmh > 0)) {
    html += '<div class="chart-card">' +
      '<h3>Wind Gusts (24h)</h3>' +
      '<canvas id="gustChart" height="140"></canvas>' +
    '</div>';
  }

  // ───── SEASONAL CALENDAR ─────
  if (seasonal.available && seasonal.daily && seasonal.daily.length) {
    html += '<div class="section-label">3-Month Forecast Calendar</div>';
    html += '<div class="cal-wrap" id="seasonalCalendar"></div>';
  }

  // ───── DAYLIGHT CALENDAR ─────
  if (daylightCal.monthly && daylightCal.monthly.length) {
    html += '<div class="section-label">Yearly Daylight Calendar</div>';
    html += '<div class="chart-card">' +
      '<h3>Daylight vs. Darkness by Month</h3>' +
      '<div style="text-align:center;margin-bottom:6px;font-size:12px;color:var(--text-dim)">' +
        'Today: <strong>' + daylightCal.today_daylight + 'h</strong> of daylight, <strong>' + daylightCal.today_darkness + 'h</strong> of darkness' +
      '</div>' +
      '<div class="daylight-chart-wrap"><canvas id="daylightChart" height="200"></canvas></div>' +
      '<div class="widget-explain" style="margin-top:6px">Shows how daylight hours expand in summer and shrink in winter at your latitude (' + (d.latitude || '43.9') + '°N). The longest day (summer solstice) is in June; the shortest (winter solstice) is in December.</div>' +
    '</div>';
  }

  // ───── COLLAPSIBLE MODEL DETAILS ─────
  html += '<details class="model-details">' +
    '<summary>Model Comparison &amp; Raw Data</summary>' +
    '<div class="model-inner">' +
      '<div class="model-section-title">Weather Models Used</div>' +
      '<div>' + models.map(m => '<span class="model-chip"><span class="mn">' + esc(m) + '</span></span>').join('') + '</div>' +
      '<div class="widget-explain">Multiple independent weather models are compared. When they agree, the forecast is more reliable. Spread = how much they disagree.</div>' +
      (conf.temp_spread_6h != null ? '<div class="stat-row"><span class="stat-label">Temp spread (6h)</span><span class="stat-value">' + conf.temp_spread_6h + '°C</span></div>' : '') +
      (conf.precip_spread_6h != null ? '<div class="stat-row"><span class="stat-label">Precip spread (6h)</span><span class="stat-value">' + conf.precip_spread_6h + 'mm</span></div>' : '') +
      buildModelBars('Precipitation by model (24h)', (p24.model_totals_mm||{}), 'mm', 'var(--accent)') +
      buildModelBars('Snow by model (24h)', (p24.snow_totals_cm||{}), 'cm', 'var(--purple)') +
      '<div class="model-section-title">Wind (24h)</div>' +
      Object.entries((wind.next_24h||{}).model_max_gust_kmh||{}).map(function(e) {
        return '<span class="model-chip"><span class="mn">' + esc(e[0]) + '</span> gust ' + e[1] + ' km/h</span>';
      }).join('') +
    '</div>' +
  '</details>';

  // ───── AI BRIEFING ─────
  if (briefing) {
    html += '<div class="briefing-card">' +
      '<h3>AI Weather Briefing</h3>' +
      '<div>' + esc(briefing) + '</div>' +
    '</div>';
  }

  // ───── FOOTER ─────
  html += '<div class="footer">' +
    'WxBrief &mdash; Open-Meteo &middot; Environment Canada<br>' +
    'Not an official forecast &middot; Updated ' + fmtTimeAmPm(d.generated_at) +
  '</div>';

  app.innerHTML = html;

  // ───── RENDER CHARTS ─────
  renderTempChart(temp, hourlyComp);
  renderPrecipProbChart(precipTimeline);
  renderPrecipChart(hourlyComp);
  renderGustChart(gustTimeline);
  if (daylightCal.monthly) renderDaylightChart(daylightCal);
  if (seasonal.available && seasonal.daily) initSeasonalCalendar(seasonal);
}

// ───── CHART: Temperature + Feels Like ─────
function renderTempChart(temp, hourlyComp) {
  const canvas = document.getElementById('tempChart');
  if (!canvas) return;
  const hourlyByModel = temp.hourly_by_model || {};
  const modelNames = Object.keys(hourlyByModel);
  if (!modelNames.length) return;

  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const gridColor = isDark ? '#2a2d3a' : '#e5e7eb';
  const textColor = isDark ? '#8b8d97' : '#6b7280';
  const colors = ['#3b82f6','#16a34a','#d97706','#7c3aed','#ea580c'];

  const labels = (hourlyByModel[modelNames[0]]||[]).map(h => {
    if (!h.time) return '';
    const d = new Date(h.time);
    return fmtHour(d.getHours());
  });

  const datasets = [];
  modelNames.forEach((name, i) => {
    datasets.push({
      label: name,
      data: (hourlyByModel[name]||[]).map(h => h.temp),
      borderColor: colors[i%colors.length],
      backgroundColor: 'transparent',
      borderWidth: 2, pointRadius: 0, tension: 0.35,
    });
  });
  const feelsData = hourlyComp.slice(0,24).map(h =>
    h.feels_like && h.feels_like.available ? h.feels_like.mean : null
  );
  if (feelsData.some(v => v !== null)) {
    datasets.push({
      label: 'Feels Like',
      data: feelsData,
      borderColor: isDark ? '#f87171' : '#dc2626',
      backgroundColor: 'transparent',
      borderWidth: 1.5, borderDash: [5,4], pointRadius: 0, tension: 0.35,
    });
  }

  new Chart(canvas, {
    type: 'line', data: { labels, datasets },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: textColor, font: { size: 10 }, boxWidth: 10 } } },
      scales: {
        x: { ticks: { color: textColor, autoSkip: false, maxRotation: 45, minRotation: 45, font: { size: 9 } }, grid: { color: gridColor } },
        y: { ticks: { color: textColor, callback: v => v + '°', font: { size: 10 } }, grid: { color: gridColor } }
      }
    }
  });
}

// ───── CHART: Precip Probability ─────
function renderPrecipProbChart(timeline) {
  const canvas = document.getElementById('precipProbChart');
  if (!canvas || !timeline.length) return;

  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const gridColor = isDark ? '#2a2d3a' : '#e5e7eb';
  const textColor = isDark ? '#8b8d97' : '#6b7280';

  const labels = timeline.map(t => {
    const d = parseTime(t.time);
    return d ? fmtHour(d.getHours()) : '';
  });

  var hasSpread = timeline.some(t => t.prob_min != null);
  var datasets = [];
  if (hasSpread) {
    datasets.push({
      label: 'Model range',
      data: timeline.map(t => t.prob_max != null ? t.prob_max : t.prob),
      backgroundColor: (isDark ? '#60a5fa' : '#3b82f6') + '25',
      borderColor: 'transparent',
      borderWidth: 0, borderRadius: 2,
    });
  }
  datasets.push({
    label: 'Mean probability %',
    data: timeline.map(t => t.prob),
    backgroundColor: (isDark ? '#60a5fa' : '#3b82f6') + '80',
    borderColor: isDark ? '#60a5fa' : '#3b82f6',
    borderWidth: 1, borderRadius: 2,
  });

  new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: { legend: { display: hasSpread, labels: { color: textColor, font: { size: 9 } } } },
      scales: {
        x: { ticks: { color: textColor, autoSkip: false, maxRotation: 45, minRotation: 45, font: { size: 9 } }, grid: { color: gridColor } },
        y: { min: 0, max: 100, ticks: { color: textColor, callback: v => v + '%', font: { size: 10 } }, grid: { color: gridColor } }
      }
    }
  });
}

// ───── CHART: Precipitation Amount ─────
function renderPrecipChart(hourlyComp) {
  const canvas = document.getElementById('precipChart');
  if (!canvas) return;
  const next24 = hourlyComp.slice(0, 24);
  if (!next24.length) return;

  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const gridColor = isDark ? '#2a2d3a' : '#e5e7eb';
  const textColor = isDark ? '#8b8d97' : '#6b7280';

  const labels = next24.map(h => {
    const d = parseTime(h.time);
    return d ? fmtHour(d.getHours()) : '';
  });

  const first = next24[0].precip || {};
  const modelNames = Object.keys(first.values || {});
  const colors = ['#3b82f6','#16a34a','#d97706','#7c3aed','#ea580c'];

  const datasets = modelNames.map((name, i) => ({
    label: name,
    data: next24.map(h => ((h.precip||{}).values||{})[name]||0),
    backgroundColor: colors[i%colors.length] + '80',
    borderColor: colors[i%colors.length],
    borderWidth: 1, borderRadius: 2,
  }));

  new Chart(canvas, {
    type: 'bar', data: { labels, datasets },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: textColor, font: { size: 10 }, boxWidth: 10 } } },
      scales: {
        x: { ticks: { color: textColor, autoSkip: false, maxRotation: 45, minRotation: 45, font: { size: 9 } }, grid: { color: gridColor } },
        y: { ticks: { color: textColor, callback: v => v + 'mm', font: { size: 10 } }, grid: { color: gridColor }, beginAtZero: true }
      }
    }
  });
}

// ───── CHART: Wind Gusts ─────
function renderGustChart(timeline) {
  const canvas = document.getElementById('gustChart');
  if (!canvas || !timeline.length) return;

  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const gridColor = isDark ? '#2a2d3a' : '#e5e7eb';
  const textColor = isDark ? '#8b8d97' : '#6b7280';

  const labels = timeline.map(t => {
    const d = parseTime(t.time);
    return d ? fmtHour(d.getHours()) : '';
  });

  new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Gusts km/h',
        data: timeline.map(t => t.gust_kmh),
        borderColor: isDark ? '#fb923c' : '#ea580c',
        backgroundColor: (isDark ? '#fb923c' : '#ea580c') + '20',
        fill: true, borderWidth: 2, pointRadius: 0, tension: 0.35,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: textColor, autoSkip: false, maxRotation: 45, minRotation: 45, font: { size: 9 } }, grid: { color: gridColor } },
        y: { ticks: { color: textColor, callback: v => v + ' km/h', font: { size: 10 } }, grid: { color: gridColor }, beginAtZero: true }
      }
    }
  });
}

// ───── CHART: Daylight Calendar ─────
function renderDaylightChart(cal) {
  const canvas = document.getElementById('daylightChart');
  if (!canvas || !cal.monthly) return;

  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const gridColor = isDark ? '#2a2d3a' : '#e5e7eb';
  const textColor = isDark ? '#8b8d97' : '#6b7280';

  const labels = cal.monthly.map(m => m.month);
  const daylight = cal.monthly.map(m => m.avg_daylight);
  const darkness = cal.monthly.map(m => m.avg_darkness);

  const todayMonthIdx = new Date().getMonth();

  new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'Daylight',
          data: daylight,
          backgroundColor: daylight.map((v, i) => i === todayMonthIdx ? '#f59e0b' : (isDark ? '#fbbf2480' : '#f59e0b60')),
          borderColor: daylight.map((v, i) => i === todayMonthIdx ? '#f59e0b' : 'transparent'),
          borderWidth: daylight.map((v, i) => i === todayMonthIdx ? 2 : 0),
          borderRadius: 2,
        },
        {
          label: 'Darkness',
          data: darkness,
          backgroundColor: isDark ? '#1e293b' : '#94a3b860',
          borderRadius: 2,
        }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: textColor, font: { size: 10 }, boxWidth: 10 } } },
      scales: {
        x: { stacked: true, ticks: { color: textColor, font: { size: 10 } }, grid: { display: false } },
        y: { stacked: true, max: 24, ticks: { color: textColor, callback: v => v + 'h', font: { size: 10 } }, grid: { color: gridColor } }
      }
    }
  });
}


// ───── INTERACTIVE SEASONAL CALENDAR ─────
function initSeasonalCalendar(seasonal) {
  const wrap = document.getElementById('seasonalCalendar');
  if (!wrap || !seasonal.daily || !seasonal.daily.length) return;

  const daily = seasonal.daily;
  const byDate = {};
  daily.forEach(d => { byDate[d.date] = d; });

  // Group into months
  const months = [];
  const seen = {};
  daily.forEach(d => {
    try {
      const dt = new Date(d.date + 'T00:00:00');
      const key = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
      if (!seen[key]) {
        seen[key] = true;
        months.push({ year: dt.getFullYear(), month: dt.getMonth() });
      }
    } catch(e) {}
  });

  let currentIdx = 0;
  let selectedDate = null;

  // Temp color scale
  const allHighs = daily.map(d => d.high).filter(v => v != null);
  const tempMin = Math.min(...allHighs);
  const tempMax = Math.max(...allHighs);

  function tempColor(t) {
    if (t == null) return 'var(--card-border)';
    const ratio = (t - tempMin) / ((tempMax - tempMin) || 1);
    if (ratio < 0.25) return 'var(--accent)';
    if (ratio < 0.5) return 'var(--teal)';
    if (ratio < 0.75) return 'var(--yellow)';
    return 'var(--orange)';
  }

  function renderMonth() {
    const m = months[currentIdx];
    if (!m) return;
    const today = new Date();
    const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
    const monthName = new Date(m.year, m.month, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const firstDay = new Date(m.year, m.month, 1).getDay();
    const daysInMonth = new Date(m.year, m.month + 1, 0).getDate();

    let h = '<div class="cal-nav">' +
      '<button class="cal-nav-btn" id="calPrev"' + (currentIdx === 0 ? ' disabled' : '') + '>&larr;</button>' +
      '<div class="cal-month-title">' + esc(monthName) + '</div>' +
      '<button class="cal-nav-btn" id="calNext"' + (currentIdx >= months.length - 1 ? ' disabled' : '') + '>&rarr;</button>' +
    '</div>';

    h += '<div class="cal-grid">';
    var dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    dayNames.forEach(d => { h += '<div class="cal-header">' + d + '</div>'; });

    for (var e = 0; e < firstDay; e++) {
      h += '<div class="cal-day-empty"></div>';
    }

    for (var day = 1; day <= daysInMonth; day++) {
      var dateStr = m.year + '-' + String(m.month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      var dd = byDate[dateStr];
      var isToday = dateStr === todayStr;
      var isSel = dateStr === selectedDate;
      var cls = 'cal-day' + (isToday ? ' today' : '') + (isSel ? ' selected' : '');
      var bg = dd && dd.high != null ? tempColor(dd.high) : 'var(--card-border)';
      var hasPrecip = dd && dd.precip_mm != null && dd.precip_mm > 1;

      h += '<div class="' + cls + '" data-date="' + dateStr + '" style="background:' + bg + '20">' +
        '<div class="cal-d">' + day + '</div>';
      if (dd && dd.high != null) {
        h += '<div class="cal-hi">' + Math.round(dd.high) + '°</div>';
      }
      if (hasPrecip) {
        h += '<div style="font-size:8px;color:var(--accent);font-weight:700;line-height:1">' + Math.round(dd.precip_mm) + 'mm</div>';
      }
      h += '</div>';
    }
    h += '</div>';

    // Legend
    h += '<div style="display:flex;gap:12px;justify-content:center;margin:8px 0;font-size:10px;color:var(--text-dim)">' +
      '<span>🟡 Today</span>' +
      '<span style="color:var(--red)">Red = High temp</span>' +
      '<span style="color:var(--accent)">Blue mm = Rain expected</span>' +
      '<span>Tap a day for details</span>' +
    '</div>';

    // Detail panel
    if (selectedDate && byDate[selectedDate]) {
      var sd = byDate[selectedDate];
      var dt = new Date(selectedDate + 'T00:00:00');
      var dayFull = dt.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      h += '<div class="cal-detail">' +
        '<div class="cal-detail-title">' + esc(dayFull) + '</div>' +
        '<div class="cal-detail-grid">' +
          '<div class="cal-detail-item"><div class="cal-detail-label">High</div><div class="cal-detail-val" style="color:var(--red)">' + (sd.high != null ? Math.round(sd.high) + '°C' : '--') + '</div></div>' +
          '<div class="cal-detail-item"><div class="cal-detail-label">Low</div><div class="cal-detail-val" style="color:var(--accent)">' + (sd.low != null ? Math.round(sd.low) + '°C' : '--') + '</div></div>' +
          '<div class="cal-detail-item"><div class="cal-detail-label">Avg Temperature</div><div class="cal-detail-val">' + (sd.mean != null ? Math.round(sd.mean) + '°C' : '--') + '</div></div>' +
          '<div class="cal-detail-item"><div class="cal-detail-label">Precipitation</div><div class="cal-detail-val" style="color:var(--accent)">' + (sd.precip_mm != null ? sd.precip_mm + ' mm' : '0 mm') + '</div></div>' +
        '</div>' +
        '<div class="widget-explain" style="margin-top:8px">Long-range seasonal forecast from ECMWF SEAS5 model. Accuracy decreases further into the future — treat as a general trend, not a precise prediction.</div>' +
      '</div>';
    } else {
      h += '<div style="text-align:center;padding:12px 0;font-size:12px;color:var(--text-dim)">Tap any day to see its forecast details</div>';
    }

    wrap.innerHTML = h;

    // Attach events
    document.getElementById('calPrev').addEventListener('click', function() {
      if (currentIdx > 0) { currentIdx--; selectedDate = null; renderMonth(); }
    });
    document.getElementById('calNext').addEventListener('click', function() {
      if (currentIdx < months.length - 1) { currentIdx++; selectedDate = null; renderMonth(); }
    });
    wrap.querySelectorAll('.cal-day').forEach(function(el) {
      el.addEventListener('click', function() {
        selectedDate = this.getAttribute('data-date');
        renderMonth();
      });
    });
  }

  renderMonth();
}

// ───── HELPERS ─────
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function parseTime(iso) {
  if (!iso) return null;
  try { return new Date(iso); } catch(e) { return null; }
}

function fmtTimeAmPm(iso) {
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit', hour12:true });
  } catch(e) { return iso; }
}

function fmtHour(h) {
  if (h == null) return '';
  const ampm = h >= 12 ? 'PM' : 'AM';
  const hr = h % 12 || 12;
  return hr + ' ' + ampm;
}

function fmtShortTime(iso) {
  if (!iso) return '--';
  try { return new Date(iso).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', hour12:true }); } catch(e) { return iso; }
}

function dirToDeg(dir) {
  const map = {N:0,NNE:22.5,NE:45,ENE:67.5,E:90,ESE:112.5,SE:135,SSE:157.5,S:180,SSW:202.5,SW:225,WSW:247.5,W:270,WNW:292.5,NW:315,NNW:337.5};
  return map[(dir||'').toUpperCase()] ?? null;
}

function degToDir(deg) {
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(((deg%360)+360)%360/22.5)%16];
}

function uvCategory(uv) {
  if (uv == null) return '';
  if (uv <= 2) return 'Low — no sun protection needed';
  if (uv <= 5) return 'Moderate — wear sunscreen outdoors';
  if (uv <= 7) return 'High — reduce midday sun exposure';
  if (uv <= 10) return 'Very high — extra protection needed';
  return 'Extreme — avoid being outside';
}

function compassDir(deg) {
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(((deg % 360) / 22.5)) % 16];
}

function visibilityTip(km) {
  if (km == null) return '';
  if (km >= 10) return 'Excellent visibility — clear conditions';
  if (km >= 4) return 'Good visibility';
  if (km >= 1) return 'Reduced — drive with caution';
  return 'Very poor — use extreme caution driving';
}

function pressureTrend(trend) {
  if (!trend) return 'Trend data not available';
  const map = { rising: '↑ Rising — clearing skies likely', falling: '↓ Falling — weather change possible', steady: '→ Steady — current conditions will persist' };
  return map[trend] || trend;
}

function aqiToColor(aqi) {
  if (aqi == null) return 'var(--text-dim)';
  if (aqi <= 50) return 'var(--green)';
  if (aqi <= 100) return 'var(--yellow)';
  if (aqi <= 150) return 'var(--orange)';
  return 'var(--red)';
}

function formatPollutant(p) {
  const map = { pm2_5:'PM2.5 (fine particles)', pm10:'PM10 (coarse particles)', ozone:'Ozone', nitrogen_dioxide:'Nitrogen Dioxide', sulphur_dioxide:'Sulphur Dioxide', carbon_monoxide:'Carbon Monoxide' };
  return map[p] || p;
}

function fmtOccurrence(occ) {
  const map = { none:'None expected', all_agree_yes:'All models agree', most_say_yes:'Most models agree', minority_say_yes:'Some models show' };
  return map[occ] || occ || '--';
}

function explainOccurrence(occ) {
  const map = { all_agree_yes:'all weather models predict precipitation — high confidence', most_say_yes:'most weather models predict precipitation', minority_say_yes:'only some models show it — lower confidence', none:'no models predict precipitation' };
  return map[occ] || 'uncertain';
}

function avgPrecip(p) {
  const totals = Object.values(p.model_totals_mm || {});
  if (!totals.length) return '--';
  return (totals.reduce((a,b) => a+b, 0) / totals.length).toFixed(1);
}

function buildSunArc(sun) {
  const rise = sun.sunrise ? fmtShortTime(sun.sunrise) : '--';
  const set = sun.sunset ? fmtShortTime(sun.sunset) : '--';

  let progress = 0.5;
  if (sun.sunrise && sun.sunset) {
    const now = Date.now();
    const riseT = new Date(sun.sunrise).getTime();
    const setT = new Date(sun.sunset).getTime();
    if (now < riseT) progress = 0;
    else if (now > setT) progress = 1;
    else progress = (now - riseT) / (setT - riseT);
  }

  const angle = Math.PI - progress * Math.PI;
  const cx = 80 + 55 * Math.cos(angle);
  const cy = 65 - 50 * Math.sin(angle);

  return '<div class="sun-arc-wrap">' +
    '<svg viewBox="0 0 160 75" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M 25 65 A 55 50 0 0 1 135 65" stroke="var(--card-border)" stroke-width="3" fill="none"/>' +
      '<path d="M 25 65 A 55 50 0 0 1 135 65" stroke="var(--yellow)" stroke-width="3" fill="none" stroke-dasharray="' + (progress*173).toFixed(0) + ' 173"/>' +
      '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="5" fill="var(--yellow)"/>' +
      '<line x1="25" y1="65" x2="135" y2="65" stroke="var(--card-border)" stroke-width="1"/>' +
    '</svg>' +
    '<div class="sun-time-row"><span>↑ ' + rise + '</span><span>↓ ' + set + '</span></div>' +
  '</div>';
}

function buildRadarCarousel(radar, locationName) {
  var bbox = radar.bbox;
  var w = radar.width;
  var h = radar.height;
  var lonSpan = bbox.lon_max - bbox.lon_min;
  var latSpan = bbox.lat_max - bbox.lat_min;
  var frames = radar.frames || [{ image_base64: radar.image_base64, label: 'Now', type: 'radar', precip_type: radar.precip_type || 'rain' }];
  var isSnow = (radar.precip_type || 'rain') === 'snow';

  function toX(lon) { return ((lon - bbox.lon_min) / lonSpan * w).toFixed(1); }
  function toY(lat) { return ((1 - (lat - bbox.lat_min) / latSpan) * h).toFixed(1); }

  // --- SVG basemap ---
  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" class="radar-svg-base">';
  // Grid
  for (var lat = Math.ceil(bbox.lat_min); lat <= bbox.lat_max; lat += 0.5) {
    svg += '<line x1="0" y1="' + toY(lat) + '" x2="' + w + '" y2="' + toY(lat) + '" stroke="#1a1f30" stroke-width="0.5"/>';
  }
  for (var lon = Math.ceil(bbox.lon_min); lon <= bbox.lon_max; lon += 0.5) {
    svg += '<line x1="' + toX(lon) + '" y1="0" x2="' + toX(lon) + '" y2="' + h + '" stroke="#1a1f30" stroke-width="0.5"/>';
  }

  // Regional municipality boundaries — real traced outlines (OpenStreetMap
  // via Nominatim, see tools/build_basemap.py), not approximated segments.
  var regions = radar.regions || [];
  regions.forEach(function(r) {
    var pts = r.outline;
    if (pts.length >= 3) {
      var rp = 'M' + toX(pts[0].lon) + ',' + toY(pts[0].lat);
      for (var i = 1; i < pts.length; i++) { rp += ' L' + toX(pts[i].lon) + ',' + toY(pts[i].lat); }
      rp += ' Z';
      svg += '<path d="' + rp + '" fill="none" stroke="#2a3550" stroke-width="1" stroke-dasharray="6,3"/>';
    }
  });

  // Region labels
  var rLabels = radar.region_labels || [];
  rLabels.forEach(function(r) {
    svg += '<text x="' + toX(r.lon) + '" y="' + toY(r.lat) + '" fill="#222d45" font-size="10" font-weight="700" ' +
      'font-family="Inter,sans-serif" text-anchor="middle" paint-order="stroke" stroke="#080c14" stroke-width="2.5">' +
      esc(r.name) + '</text>';
  });

  // Lake Ontario
  var shore = radar.shoreline || [];
  if (shore.length > 2) {
    var path = 'M' + toX(shore[0].lon) + ',' + toY(shore[0].lat);
    for (var i = 1; i < shore.length; i++) { path += ' L' + toX(shore[i].lon) + ',' + toY(shore[i].lat); }
    path += ' L' + w + ',' + h + ' L0,' + h + ' Z';
    svg += '<path d="' + path + '" fill="#040a14" stroke="none"/>';
    var sp = 'M' + toX(shore[0].lon) + ',' + toY(shore[0].lat);
    for (var i = 1; i < shore.length; i++) { sp += ' L' + toX(shore[i].lon) + ',' + toY(shore[i].lat); }
    svg += '<path d="' + sp + '" fill="none" stroke="#1e3860" stroke-width="1.5"/>';
    var lakeX = toX((bbox.lon_min + bbox.lon_max) / 2);
    var lakeY = toY(bbox.lat_min + (latSpan * 0.12));
    svg += '<text x="' + lakeX + '" y="' + lakeY + '" fill="#152540" font-size="13" font-weight="700" ' +
      'font-family="Inter,sans-serif" text-anchor="middle" font-style="italic">Lake Ontario</text>';
  }
  svg += '</svg>';

  // --- SVG city labels ---
  var labelSvg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" class="radar-svg-labels">';
  var cities = radar.cities || [];
  var targetCity = locationName.split(',')[0].trim().toLowerCase();

  cities.forEach(function(c) {
    var cx = toX(c.lon);
    var cy = toY(c.lat);
    var isTarget = c.name.toLowerCase() === targetCity;
    if (isTarget) {
      labelSvg += '<circle cx="' + cx + '" cy="' + cy + '" r="14" stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.5">' +
        '<animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite"/>' +
        '<animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/></circle>';
      labelSvg += '<circle cx="' + cx + '" cy="' + cy + '" r="4" fill="#60a5fa"/>';
      labelSvg += '<line x1="' + (parseFloat(cx)-18) + '" y1="' + cy + '" x2="' + (parseFloat(cx)-6) + '" y2="' + cy + '" stroke="#60a5fa" stroke-width="1.5"/>';
      labelSvg += '<line x1="' + (parseFloat(cx)+6) + '" y1="' + cy + '" x2="' + (parseFloat(cx)+18) + '" y2="' + cy + '" stroke="#60a5fa" stroke-width="1.5"/>';
      labelSvg += '<line x1="' + cx + '" y1="' + (parseFloat(cy)-18) + '" x2="' + cx + '" y2="' + (parseFloat(cy)-6) + '" stroke="#60a5fa" stroke-width="1.5"/>';
      labelSvg += '<line x1="' + cx + '" y1="' + (parseFloat(cy)+6) + '" x2="' + cx + '" y2="' + (parseFloat(cy)+18) + '" stroke="#60a5fa" stroke-width="1.5"/>';
      labelSvg += '<text x="' + (parseFloat(cx)+18) + '" y="' + (parseFloat(cy)+5) + '" fill="#60a5fa" font-size="16" font-weight="800" ' +
        'font-family="Inter,sans-serif" paint-order="stroke" stroke="#080c14" stroke-width="4" stroke-linejoin="round">' + esc(c.name) + '</text>';
    } else if (c.major) {
      labelSvg += '<circle cx="' + cx + '" cy="' + cy + '" r="3" fill="#c0ccdf"/>';
      labelSvg += '<text x="' + (parseFloat(cx)+7) + '" y="' + (parseFloat(cy)-6) + '" fill="#c0ccdf" font-size="13" font-weight="700" ' +
        'font-family="Inter,sans-serif" paint-order="stroke" stroke="#080c14" stroke-width="4" stroke-linejoin="round">' + esc(c.name) + '</text>';
    } else {
      labelSvg += '<circle cx="' + cx + '" cy="' + cy + '" r="2" fill="#7888a0"/>';
      labelSvg += '<text x="' + (parseFloat(cx)+6) + '" y="' + (parseFloat(cy)-4) + '" fill="#8898b0" font-size="11" font-weight="600" ' +
        'font-family="Inter,sans-serif" paint-order="stroke" stroke="#080c14" stroke-width="3.5" stroke-linejoin="round">' + esc(c.name) + '</text>';
    }
  });
  labelSvg += '</svg>';

  // --- Build carousel frames ---
  var html = '<div class="radar-card">';
  html += '<div class="radar-header">' +
    '<div><span class="radar-title">Radar & Forecast</span>' +
    '<div class="radar-subtitle">Environment Canada · Map: OpenStreetMap · Pinch or scroll to zoom</div></div>' +
    '<div class="radar-frame-nav">' +
      '<button class="radar-nav-btn" onclick="radarTogglePlay()" id="radarPlayBtn" aria-label="Play animation">&#9654;&#9654;</button>' +
      '<button class="radar-nav-btn" onclick="radarNav(-1)" aria-label="Previous frame">&#9664;</button>' +
      '<span class="radar-frame-label" id="radarFrameLabel">' + esc(frames[0].label) + '</span>' +
      '<button class="radar-nav-btn" onclick="radarNav(1)" aria-label="Next frame">&#9654;</button>' +
    '</div>' +
  '</div>';

  // Time slider
  html += '<div class="radar-slider-wrap">';
  html += '<div class="radar-slider-labels" id="radarSliderLabels">';
  for (var fi = 0; fi < frames.length; fi++) {
    html += '<span' + (fi === 0 ? ' class="active"' : '') + ' onclick="radarGo(' + fi + ')">' + esc(frames[fi].label) + '</span>';
  }
  html += '</div>';
  html += '<input type="range" class="radar-time-slider" id="radarTimeSlider" min="0" max="' + (frames.length - 1) + '" value="0" oninput="radarGo(parseInt(this.value))">';
  html += '</div>';

  // Numeric precip readout for the selected frame — actual mm/cm, not just color
  html += '<div class="radar-precip-readout" id="radarPrecipReadout"></div>';

  // Zoomable map container
  html += '<div class="radar-zoom-wrap" id="radarZoomWrap">';
  html += '<div class="radar-container" id="radarContainer">';
  html += svg;
  for (var fi = 0; fi < frames.length; fi++) {
    html += '<img src="data:image/png;base64,' + frames[fi].image_base64 + '" class="radar-frame-img' +
      (fi === 0 ? ' active' : '') + '" data-frame="' + fi + '" alt="' + esc(frames[fi].label) + '"/>';
  }
  html += labelSvg;
  html += '</div></div>';

  // Legend - changes based on frame type. Uses EC's actual GetLegendGraphic
  // image when available (real color scale), falling back to an approximate
  // CSS gradient only if that fetch failed.
  var precipWord = isSnow ? 'snow' : 'rain';
  var legendRadarImg = radar.legend_radar_base64;
  var legendForecastImg = radar.legend_forecast_base64;
  html += '<div id="radarLegendBlock">';
  // Radar legend (frame 0)
  html += '<div class="radar-legend-section" id="legendRadar">';
  if (legendRadarImg) {
    html += '<div class="radar-legend-img-wrap"><img class="radar-legend-img" src="data:image/png;base64,' + legendRadarImg + '" alt="Radar intensity legend"/></div>';
  } else {
    html += '<div class="radar-legend"><div class="radar-legend-bar"></div></div>';
    html += '<div class="radar-legend-labels"><span>Very light</span><span>Light</span><span>Moderate</span><span>Heavy</span><span>Intense</span></div>';
  }
  html += '<div class="radar-explain">' +
    'Live radar showing where ' + precipWord + ' is falling <strong style="color:#8898b0">right now</strong>, straight from Environment Canada\'s own color scale.' +
  '</div></div>';
  // Forecast legend
  html += '<div class="radar-legend-section" id="legendForecast" style="display:none">';
  if (legendForecastImg) {
    html += '<div class="radar-legend-img-wrap"><img class="radar-legend-img" src="data:image/png;base64,' + legendForecastImg + '" alt="Forecast probability legend"/></div>';
  } else {
    html += '<div class="radar-legend"><div class="radar-legend-bar" style="background:linear-gradient(90deg,#0a1a40 0%,#1a3a80 15%,#00a0c0 30%,#60d0a0 42%,#e0e040 55%,#f0a020 68%,#e04020 80%,#c01060 90%,#ff40c0 100%)"></div></div>';
    html += '<div class="radar-legend-labels"><span>0%</span><span>20%</span><span>40%</span><span>60%</span><span>80%</span><span>100%</span></div>';
  }
  html += '<div class="radar-explain">' +
    'HRDPS forecast: <strong style="color:#8898b0">probability of ' + precipWord + '</strong> at the selected time, EC\'s own color scale.' +
  '</div></div>';
  html += '</div>';

  html += '</div>';

  window.__radarMeta = {
    count: frames.length,
    labels: frames.map(function(f){ return f.label }),
    types: frames.map(function(f){ return f.type }),
    rainMm: frames.map(function(f){ return f.rain_mm }),
    snowCm: frames.map(function(f){ return f.snow_cm }),
    precipProb: frames.map(function(f){ return f.precip_prob_pct }),
    rainRateMmh: frames.map(function(f){ return f.rain_rate_mmh })
  };

  return html;
}

function buildModelBars(title, totals, unit, color) {
  const entries = Object.entries(totals);
  if (!entries.length || entries.every(function(e) { return e[1] === 0; })) return '';
  const mx = Math.max(1, ...entries.map(function(e) { return e[1]; }));
  let html = '<div class="model-section-title">' + esc(title) + '</div>';
  for (const e of entries) {
    const pct = (e[1]/mx*100).toFixed(0);
    html += '<div class="precip-bar">' +
      '<span class="bar-label">' + esc(e[0]) + '</span>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
      '<span class="bar-value">' + e[1] + ' ' + unit + '</span>' +
    '</div>';
  }
  return html;
}

render();

// ── Radar carousel + zoom ──
(function(){
  var wrap = document.getElementById('radarZoomWrap');
  if (!wrap || !window.__radarMeta) return;
  var radarFrames = window.__radarMeta.count;
  var radarLabels = window.__radarMeta.labels;
  var radarTypes = window.__radarMeta.types;
  var radarRainMm = window.__radarMeta.rainMm;
  var radarSnowCm = window.__radarMeta.snowCm;
  var radarPrecipProb = window.__radarMeta.precipProb;
  var radarRainRateMmh = window.__radarMeta.rainRateMmh;
  var radarIdx = 0;
  var radarPlayTimer = null;

  window.radarGo = function(i) {
    radarIdx = Math.max(0, Math.min(i, radarFrames - 1));
    var imgs = document.querySelectorAll('.radar-frame-img');
    imgs.forEach(function(img){ img.classList.toggle('active', parseInt(img.dataset.frame) === radarIdx) });
    var slider = document.getElementById('radarTimeSlider');
    if (slider) slider.value = radarIdx;
    var sliderLabels = document.querySelectorAll('#radarSliderLabels span');
    sliderLabels.forEach(function(s, j){ s.classList.toggle('active', j === radarIdx) });
    var lbl = document.getElementById('radarFrameLabel');
    if (lbl) lbl.textContent = radarLabels[radarIdx] || '';
    var isFC = radarTypes[radarIdx] === 'forecast';
    var lr = document.getElementById('legendRadar');
    var lf = document.getElementById('legendForecast');
    if (lr) lr.style.display = isFC ? 'none' : '';
    if (lf) lf.style.display = isFC ? '' : 'none';

    var readout = document.getElementById('radarPrecipReadout');
    if (readout) {
      var rain = radarRainMm ? radarRainMm[radarIdx] : null;
      var snow = radarSnowCm ? radarSnowCm[radarIdx] : null;
      var prob = radarPrecipProb ? radarPrecipProb[radarIdx] : null;
      var rate = radarRainRateMmh ? radarRainRateMmh[radarIdx] : null;
      var parts = [];
      if (isFC) {
        // Probability is read from the exact map pixel — always matches the color shown.
        if (prob != null) parts.push('<span class="radar-precip-prob-main">' + prob + '% chance <span class="radar-precip-tag">(this map)</span></span>');
        var amtBits = [];
        if (snow != null && snow > 0) amtBits.push(snow + ' cm snow');
        if (rain != null && rain > 0) amtBits.push(rain + ' mm rain');
        if (amtBits.length) parts.push('<span class="radar-precip-amt">Expected: ' + amtBits.join(' + ') + ' <span class="radar-precip-tag">(model forecast)</span></span>');
        if (!parts.length) parts.push('<span class="radar-precip-none">No precipitation expected</span>');
      } else {
        // "Now": rate is read from the exact radar pixel — always matches the color shown.
        if (rate != null) {
          parts.push(rate > 0
            ? '<span class="radar-precip-rain">🌧 ' + rate + ' mm/h right now <span class="radar-precip-tag">(this map)</span></span>'
            : '<span class="radar-precip-none">No precipitation at this location right now</span>');
        }
      }
      readout.innerHTML = parts.join('<span class="radar-precip-sep">·</span>');
    }
  };
  window.radarNav = function(d){ window.radarGo(radarIdx + d) };

  window.radarTogglePlay = function() {
    var btn = document.getElementById('radarPlayBtn');
    if (radarPlayTimer) {
      clearInterval(radarPlayTimer);
      radarPlayTimer = null;
      if (btn) btn.innerHTML = '&#9654;&#9654;';
      return;
    }
    if (btn) btn.innerHTML = '&#10074;&#10074;';
    radarPlayTimer = setInterval(function() {
      var next = radarIdx + 1;
      if (next > radarFrames - 1) next = 0;
      window.radarGo(next);
    }, 900);
  };

  // Zoom
  var rzScale=1, rzX=0, rzY=0, rzDragging=false, rzLastX=0, rzLastY=0;
  var rzCont = document.getElementById('radarContainer');
  function rzClamp() {
    var r = wrap.getBoundingClientRect();
    var mX = r.width*(rzScale-1)/2, mY = r.height*(rzScale-1)/2;
    rzX = Math.max(-mX, Math.min(mX, rzX));
    rzY = Math.max(-mY, Math.min(mY, rzY));
  }
  function rzApply() {
    if (rzCont) rzCont.style.transform = 'scale('+rzScale+') translate('+(rzX/rzScale)+'px,'+(rzY/rzScale)+'px)';
  }
  wrap.addEventListener('wheel', function(e){
    e.preventDefault();
    var d = e.deltaY > 0 ? 0.9 : 1.1;
    rzScale = Math.max(1, Math.min(5, rzScale*d));
    if (rzScale <= 1) { rzX=0; rzY=0 }
    rzApply();
  }, {passive:false});
  var lastDist = 0;
  wrap.addEventListener('touchstart', function(e){
    if (e.touches.length===2) { lastDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY) }
    else if (e.touches.length===1 && rzScale>1) { rzDragging=true; rzLastX=e.touches[0].clientX; rzLastY=e.touches[0].clientY }
  });
  wrap.addEventListener('touchmove', function(e){
    if (e.touches.length===2) {
      e.preventDefault();
      var nd = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      rzScale = Math.max(1, Math.min(5, rzScale*(nd/lastDist))); lastDist=nd;
      if (rzScale<=1) { rzX=0; rzY=0 } rzApply();
    } else if (rzDragging && e.touches.length===1) {
      e.preventDefault();
      rzX += e.touches[0].clientX-rzLastX; rzY += e.touches[0].clientY-rzLastY;
      rzLastX = e.touches[0].clientX; rzLastY = e.touches[0].clientY; rzClamp(); rzApply();
    }
  }, {passive:false});
  wrap.addEventListener('touchend', function(){ rzDragging=false; lastDist=0 });
  wrap.addEventListener('mousedown', function(e){ if(rzScale>1){rzDragging=true;rzLastX=e.clientX;rzLastY=e.clientY;e.preventDefault()} });
  window.addEventListener('mousemove', function(e){ if(rzDragging){rzX+=e.clientX-rzLastX;rzY+=e.clientY-rzLastY;rzLastX=e.clientX;rzLastY=e.clientY;rzClamp();rzApply()} });
  window.addEventListener('mouseup', function(){ rzDragging=false });
  wrap.addEventListener('dblclick', function(){ rzScale=1; rzX=0; rzY=0; rzApply() });

  // Keyboard nav
  document.addEventListener('keydown', function(e){
    if (e.key==='ArrowLeft') window.radarNav(-1);
    else if (e.key==='ArrowRight') window.radarNav(1);
  });

  window.radarGo(0);
})();
</script>
</body>
