// ───── INTERACTIVE SEASONAL CALENDAR ─────
function initSeasonalCalendar(seasonal) {
  const wrap = document.getElementById('seasonalCalendar');
  if (!wrap || !seasonal.daily || !seasonal.daily.length) return;

  const daily = seasonal.daily;
  const byDate = {};
  daily.forEach(d => { byDate[d.date] = d; });

  // Group into months
  const months = [];
  const seen = {};
  daily.forEach(d => {
    try {
      const dt = new Date(d.date + 'T00:00:00');
      const key = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
      if (!seen[key]) {
        seen[key] = true;
        months.push({ year: dt.getFullYear(), month: dt.getMonth() });
      }
    } catch(e) {}
  });

  let currentIdx = 0;
  let selectedDate = null;

  // Temp color scale
  const allHighs = daily.map(d => d.high).filter(v => v != null);
  const tempMin = Math.min(...allHighs);
  const tempMax = Math.max(...allHighs);

  function tempColor(t) {
    if (t == null) return 'var(--card-border)';
    const ratio = (t - tempMin) / ((tempMax - tempMin) || 1);
    if (ratio < 0.25) return 'var(--accent)';
    if (ratio < 0.5) return 'var(--teal)';
    if (ratio < 0.75) return 'var(--yellow)';
    return 'var(--orange)';
  }

  function renderMonth() {
    const m = months[currentIdx];
    if (!m) return;
    const today = new Date();
    const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
    const monthName = new Date(m.year, m.month, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const firstDay = new Date(m.year, m.month, 1).getDay();
    const daysInMonth = new Date(m.year, m.month + 1, 0).getDate();

    let h = '<div class="cal-nav">' +
      '<button class="cal-nav-btn" id="calPrev"' + (currentIdx === 0 ? ' disabled' : '') + '>&larr;</button>' +
      '<div class="cal-month-title">' + esc(monthName) + '</div>' +
      '<button class="cal-nav-btn" id="calNext"' + (currentIdx >= months.length - 1 ? ' disabled' : '') + '>&rarr;</button>' +
    '</div>';

    h += '<div class="cal-grid">';
    var dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    dayNames.forEach(d => { h += '<div class="cal-header">' + d + '</div>'; });

    for (var e = 0; e < firstDay; e++) {
      h += '<div class="cal-day-empty"></div>';
    }

    for (var day = 1; day <= daysInMonth; day++) {
      var dateStr = m.year + '-' + String(m.month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      var dd = byDate[dateStr];
      var isToday = dateStr === todayStr;
      var isSel = dateStr === selectedDate;
      var cls = 'cal-day' + (isToday ? ' today' : '') + (isSel ? ' selected' : '');
      var bg = dd && dd.high != null ? tempColor(dd.high) : 'var(--card-border)';
      var hasPrecip = dd && dd.precip_mm != null && dd.precip_mm > 1;

      h += '<div class="' + cls + '" data-date="' + dateStr + '" style="background:' + bg + '20">' +
        '<div class="cal-d">' + day + '</div>';
      if (dd && dd.high != null) {
        h += '<div class="cal-hi">' + Math.round(dd.high) + '°</div>';
      }
      if (hasPrecip) {
        h += '<div style="font-size:8px;color:var(--accent);font-weight:700;line-height:1">' + Math.round(dd.precip_mm) + 'mm</div>';
      }
      h += '</div>';
    }
    h += '</div>';

    // Legend
    h += '<div style="display:flex;gap:12px;justify-content:center;margin:8px 0;font-size:10px;color:var(--text-dim)">' +
      '<span>🟡 Today</span>' +
      '<span style="color:var(--red)">Red = High temp</span>' +
      '<span style="color:var(--accent)">Blue mm = Rain expected</span>' +
      '<span>Tap a day for details</span>' +
    '</div>';

    // Detail panel
    if (selectedDate && byDate[selectedDate]) {
      var sd = byDate[selectedDate];
      var dt = new Date(selectedDate + 'T00:00:00');
      var dayFull = dt.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      h += '<div class="cal-detail">' +
        '<div class="cal-detail-title">' + esc(dayFull) + '</div>' +
        '<div class="cal-detail-grid">' +
          '<div class="cal-detail-item"><div class="cal-detail-label">High</div><div class="cal-detail-val" style="color:var(--red)">' + (sd.high != null ? Math.round(sd.high) + '°C' : '--') + '</div></div>' +
          '<div class="cal-detail-item"><div class="cal-detail-label">Low</div><div class="cal-detail-val" style="color:var(--accent)">' + (sd.low != null ? Math.round(sd.low) + '°C' : '--') + '</div></div>' +
          '<div class="cal-detail-item"><div class="cal-detail-label">Avg Temperature</div><div class="cal-detail-val">' + (sd.mean != null ? Math.round(sd.mean) + '°C' : '--') + '</div></div>' +
          '<div class="cal-detail-item"><div class="cal-detail-label">Precipitation</div><div class="cal-detail-val" style="color:var(--accent)">' + (sd.precip_mm != null ? sd.precip_mm + ' mm' : '0 mm') + '</div></div>' +
        '</div>' +
        '<div class="widget-explain" style="margin-top:8px">Long-range seasonal forecast from ECMWF SEAS5 model. Accuracy decreases further into the future — treat as a general trend, not a precise prediction.</div>' +
      '</div>';
    } else {
      h += '<div style="text-align:center;padding:12px 0;font-size:12px;color:var(--text-dim)">Tap any day to see its forecast details</div>';
    }

    wrap.innerHTML = h;

    // Attach events
    document.getElementById('calPrev').addEventListener('click', function() {
      if (currentIdx > 0) { currentIdx--; selectedDate = null; renderMonth(); }
    });
    document.getElementById('calNext').addEventListener('click', function() {
      if (currentIdx < months.length - 1) { currentIdx++; selectedDate = null; renderMonth(); }
    });
    wrap.querySelectorAll('.cal-day').forEach(function(el) {
      el.addEventListener('click', function() {
        selectedDate = this.getAttribute('data-date');
        renderMonth();
      });
    });
  }

  renderMonth();
}

// ───── HELPERS ─────
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function parseTime(iso) {
  if (!iso) return null;
  try { return new Date(iso); } catch(e) { return null; }
}

function fmtTimeAmPm(iso) {
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit', hour12:true });
  } catch(e) { return iso; }
}

function fmtHour(h) {
  if (h == null) return '';
  const ampm = h >= 12 ? 'PM' : 'AM';
  const hr = h % 12 || 12;
  return hr + ' ' + ampm;
}

function fmtShortTime(iso) {
  if (!iso) return '--';
  try { return new Date(iso).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', hour12:true }); } catch(e) { return iso; }
}

function dirToDeg(dir) {
  const map = {N:0,NNE:22.5,NE:45,ENE:67.5,E:90,ESE:112.5,SE:135,SSE:157.5,S:180,SSW:202.5,SW:225,WSW:247.5,W:270,WNW:292.5,NW:315,NNW:337.5};
  return map[(dir||'').toUpperCase()] ?? null;
}

function degToDir(deg) {
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(((deg%360)+360)%360/22.5)%16];
}

function uvCategory(uv) {
  if (uv == null) return '';
  if (uv <= 2) return 'Low — no sun protection needed';
  if (uv <= 5) return 'Moderate — wear sunscreen outdoors';
  if (uv <= 7) return 'High — reduce midday sun exposure';
  if (uv <= 10) return 'Very high — extra protection needed';
  return 'Extreme — avoid being outside';
}

function compassDir(deg) {
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(((deg % 360) / 22.5)) % 16];
}

function visibilityTip(km) {
  if (km == null) return '';
  if (km >= 10) return 'Excellent visibility — clear conditions';
  if (km >= 4) return 'Good visibility';
  if (km >= 1) return 'Reduced — drive with caution';
  return 'Very poor — use extreme caution driving';
}

function pressureTrend(trend) {
  if (!trend) return 'Trend data not available';
  const map = { rising: '↑ Rising — clearing skies likely', falling: '↓ Falling — weather change possible', steady: '→ Steady — current conditions will persist' };
  return map[trend] || trend;
}

function aqiToColor(aqi) {
  if (aqi == null) return 'var(--text-dim)';
  if (aqi <= 50) return 'var(--green)';
  if (aqi <= 100) return 'var(--yellow)';
  if (aqi <= 150) return 'var(--orange)';
  return 'var(--red)';
}

function formatPollutant(p) {
  const map = { pm2_5:'PM2.5 (fine particles)', pm10:'PM10 (coarse particles)', ozone:'Ozone', nitrogen_dioxide:'Nitrogen Dioxide', sulphur_dioxide:'Sulphur Dioxide', carbon_monoxide:'Carbon Monoxide' };
  return map[p] || p;
}

function fmtOccurrence(occ) {
  const map = { none:'None expected', all_agree_yes:'All models agree', most_say_yes:'Most models agree', minority_say_yes:'Some models show' };
  return map[occ] || occ || '--';
}

function explainOccurrence(occ) {
  const map = { all_agree_yes:'all weather models predict precipitation — high confidence', most_say_yes:'most weather models predict precipitation', minority_say_yes:'only some models show it — lower confidence', none:'no models predict precipitation' };
  return map[occ] || 'uncertain';
}

function avgPrecip(p) {
  const totals = Object.values(p.model_totals_mm || {});
  if (!totals.length) return '--';
  return (totals.reduce((a,b) => a+b, 0) / totals.length).toFixed(1);
}

function buildSunArc(sun) {
  const rise = sun.sunrise ? fmtShortTime(sun.sunrise) : '--';
  const set = sun.sunset ? fmtShortTime(sun.sunset) : '--';

  let progress = 0.5;
  if (sun.sunrise && sun.sunset) {
    const now = Date.now();
    const riseT = new Date(sun.sunrise).getTime();
    const setT = new Date(sun.sunset).getTime();
    if (now < riseT) progress = 0;
    else if (now > setT) progress = 1;
    else progress = (now - riseT) / (setT - riseT);
  }

  const angle = Math.PI - progress * Math.PI;
  const cx = 80 + 55 * Math.cos(angle);
  const cy = 65 - 50 * Math.sin(angle);

  return '<div class="sun-arc-wrap">' +
    '<svg viewBox="0 0 160 75" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M 25 65 A 55 50 0 0 1 135 65" stroke="var(--card-border)" stroke-width="3" fill="none"/>' +
      '<path d="M 25 65 A 55 50 0 0 1 135 65" stroke="var(--yellow)" stroke-width="3" fill="none" stroke-dasharray="' + (progress*173).toFixed(0) + ' 173"/>' +
      '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="5" fill="var(--yellow)"/>' +
      '<line x1="25" y1="65" x2="135" y2="65" stroke="var(--card-border)" stroke-width="1"/>' +
    '</svg>' +
    '<div class="sun-time-row"><span>↑ ' + rise + '</span><span>↓ ' + set + '</span></div>' +
  '</div>';
}

// Shared basemap + city-label SVG builder, used by the radar carousel and
// the temperature/snowfall maps so all three line up visually and share
// one implementation of the region/shoreline/city overlay.
//
// opts.boundariesOnTop: when the widget paints a full-canvas color wash
// (the temperature heatmap), region outlines/labels/shoreline need to be
// drawn in a separate layer ON TOP of that color, not underneath it, or
// they wash out. Returned as `midSvg`, meant to sit between the color
// layer and the city-label layer (z-index 3, see .radar-svg-mid).
//
// opts.showValues + opts.idPrefix: gives each city's <text> a predictable
// id (idPrefix + 'CityLabel' + index) and reserves extra label width, so
// the per-frame carousel code can push a live value (e.g. "Barrie -3°")
// into that same text node without rebuilding the SVG.
function buildMapOverlay(bbox, w, h, geo, locationName, opts) {
  opts = opts || {};
  var lonSpan = bbox.lon_max - bbox.lon_min;
  var latSpan = bbox.lat_max - bbox.lat_min;
  function toX(lon) { return ((lon - bbox.lon_min) / lonSpan * w).toFixed(1); }
  function toY(lat) { return ((1 - (lat - bbox.lat_min) / latSpan) * h).toFixed(1); }

  var shore = geo.shoreline || [];

  // --- SVG base: grid lines + lake mask only — sits under any color wash
  // (radar image / temperature canvas), so it must not carry anything
  // that needs to stay legible. Region/shoreline outlines go in midSvg
  // instead, drawn ON TOP of that color layer. ---
  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" class="radar-svg-base">';
  for (var lat = Math.ceil(bbox.lat_min); lat <= bbox.lat_max; lat += 0.5) {
    svg += '<line x1="0" y1="' + toY(lat) + '" x2="' + w + '" y2="' + toY(lat) + '" stroke="#1a1f30" stroke-width="0.5"/>';
  }
  for (var lon = Math.ceil(bbox.lon_min); lon <= bbox.lon_max; lon += 0.5) {
    svg += '<line x1="' + toX(lon) + '" y1="0" x2="' + toX(lon) + '" y2="' + h + '" stroke="#1a1f30" stroke-width="0.5"/>';
  }
  if (shore.length > 2) {
    var path = 'M' + toX(shore[0].lon) + ',' + toY(shore[0].lat);
    for (var i = 1; i < shore.length; i++) { path += ' L' + toX(shore[i].lon) + ',' + toY(shore[i].lat); }
    path += ' L' + w + ',' + h + ' L0,' + h + ' Z';
    svg += '<path d="' + path + '" fill="#040a14" stroke="none"/>';
  }
  svg += '</svg>';

  // --- SVG mid layer: region/shoreline outlines drawn ON TOP of the color
  // layer (radar image or heatmap canvas), so they stay legible instead of
  // washing out underneath it. ---
  var midSvg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" class="radar-svg-mid">';
  (geo.regions || []).forEach(function(r) {
    var pts = r.outline;
    if (pts.length >= 3) {
      var rp = 'M' + toX(pts[0].lon) + ',' + toY(pts[0].lat);
      for (var i = 1; i < pts.length; i++) { rp += ' L' + toX(pts[i].lon) + ',' + toY(pts[i].lat); }
      rp += ' Z';
      midSvg += '<path d="' + rp + '" fill="none" stroke="#0b0f1a" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.75"/>';
    }
  });
  (geo.region_labels || []).forEach(function(r) {
    midSvg += '<text x="' + toX(r.lon) + '" y="' + toY(r.lat) + '" fill="#0b0f1a" font-size="10" font-weight="800" ' +
      'font-family="Inter,sans-serif" text-anchor="middle" paint-order="stroke" stroke="#f0f3fa" stroke-width="3">' +
      esc(r.name) + '</text>';
  });
  if (shore.length > 2) {
    var sp2 = 'M' + toX(shore[0].lon) + ',' + toY(shore[0].lat);
    for (var i = 1; i < shore.length; i++) { sp2 += ' L' + toX(shore[i].lon) + ',' + toY(shore[i].lat); }
    midSvg += '<path d="' + sp2 + '" fill="none" stroke="#0b1f3a" stroke-width="2"/>';
    var lakeX2 = toX((bbox.lon_min + bbox.lon_max) / 2);
    var lakeY2 = toY(bbox.lat_min + (latSpan * 0.12));
    midSvg += '<text x="' + lakeX2 + '" y="' + lakeY2 + '" fill="#0b1f3a" font-size="13" font-weight="700" ' +
      'font-family="Inter,sans-serif" text-anchor="middle" font-style="italic" paint-order="stroke" stroke="#f0f3fa" stroke-width="2.5">Lake Ontario</text>';
  }
  midSvg += '</svg>';

  // --- SVG city labels: solid pill boxes (not a text halo) so names stay
  // legible over a full-canvas color wash instead of blurring into it. ---
  var labelSvg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" class="radar-svg-labels">';
  var cities = geo.cities || [];
  var targetCity = locationName.split(',')[0].trim().toLowerCase();
  var valueRoom = opts.showValues ? 5 : 0; // reserve chars for " -30°"

  // Draw the target city's label last (so it always paints on top of any
  // nearby city's box — e.g. Oshawa sits close enough to Bowmanville that
  // whichever renders second would otherwise occlude the other's text).
  var targetIdx = -1;
  cities.forEach(function(c, ci) { if (c.name.toLowerCase() === targetCity) targetIdx = ci; });
  var drawOrder = cities.map(function(c, ci) { return ci; });
  if (targetIdx >= 0) {
    drawOrder = drawOrder.filter(function(ci) { return ci !== targetIdx; });
    drawOrder.push(targetIdx);
  }

  drawOrder.forEach(function(ci) {
    var c = cities[ci];
    var cx = parseFloat(toX(c.lon));
    var cy = parseFloat(toY(c.lat));
    var isTarget = ci === targetIdx;
    var idAttr = (opts.idPrefix ? ' id="' + opts.idPrefix + 'CityLabel' + ci + '"' : '');

    if (isTarget) {
      labelSvg += '<circle cx="' + cx + '" cy="' + cy + '" r="14" stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.5">' +
        '<animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite"/>' +
        '<animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/></circle>';
      labelSvg += '<circle cx="' + cx + '" cy="' + cy + '" r="4" fill="#60a5fa"/>';
      labelSvg += '<line x1="' + (cx-18) + '" y1="' + cy + '" x2="' + (cx-6) + '" y2="' + cy + '" stroke="#60a5fa" stroke-width="1.5"/>';
      labelSvg += '<line x1="' + (cx+6) + '" y1="' + cy + '" x2="' + (cx+18) + '" y2="' + cy + '" stroke="#60a5fa" stroke-width="1.5"/>';
      labelSvg += '<line x1="' + cx + '" y1="' + (cy-18) + '" x2="' + cx + '" y2="' + (cy-6) + '" stroke="#60a5fa" stroke-width="1.5"/>';
      labelSvg += '<line x1="' + cx + '" y1="' + (cy+6) + '" x2="' + cx + '" y2="' + (cy+18) + '" stroke="#60a5fa" stroke-width="1.5"/>';
      // Placed below the crosshair (not beside it) so it doesn't sit on
      // top of whichever neighboring city happens to be nearby — the
      // crosshair itself already pinpoints the exact location.
      var targetValueRoom = (opts.showValues || opts.showTargetValue) ? 9 : 0; // room for " 99.9mm/h"/" -30°"
      var targetIdAttr = (opts.showTargetValue && opts.idPrefix) ? ' id="' + opts.idPrefix + 'TargetLabel"' : idAttr;
      var tBoxW = Math.round((c.name.length + targetValueRoom) * 7.4 + 16);
      var tBoxX = cx - tBoxW / 2, tBoxY = cy + 21;
      labelSvg += '<rect x="' + tBoxX + '" y="' + tBoxY + '" width="' + tBoxW + '" height="24" rx="5" fill="#0b0f1a" fill-opacity="0.92" stroke="#3b6df0" stroke-width="1.2"/>';
      labelSvg += '<text' + targetIdAttr + ' x="' + cx + '" y="' + (tBoxY+17) + '" fill="#8fbdff" font-size="15" font-weight="800" font-family="Inter,sans-serif" text-anchor="middle">' + esc(c.name) + '</text>';
    } else {
      var major = c.major;
      var fontSize = major ? 12 : 10.5;
      var charW = major ? 6.9 : 6.0;
      var dotR = major ? 3 : 2;
      var boxW = Math.round((c.name.length + valueRoom) * charW + 14);
      var boxH = major ? 19 : 16;
      var boxX = cx + dotR + 4;
      var boxY = cy - boxH / 2 - (major ? 1 : 0);
      labelSvg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + dotR + '" fill="' + (major ? '#dfe6f5' : '#9aa6bc') + '"/>';
      labelSvg += '<rect x="' + boxX + '" y="' + boxY + '" width="' + boxW + '" height="' + boxH + '" rx="4" ' +
        'fill="#0b0f1a" fill-opacity="0.86" stroke="' + (major ? '#3a4666' : '#2a3550') + '" stroke-width="1"/>';
      labelSvg += '<text' + idAttr + ' x="' + (boxX+7) + '" y="' + (boxY+boxH-5) + '" ' +
        'fill="' + (major ? '#e6ebf7' : '#b6c0d4') + '" font-size="' + fontSize + '" font-weight="' + (major ? '700' : '600') + '" ' +
        'font-family="Inter,sans-serif">' + esc(c.name) + '</text>';
    }
  });
  labelSvg += '</svg>';

  return { toX: toX, toY: toY, baseSvg: svg, midSvg: midSvg, labelSvg: labelSvg };
}

function buildRadarCarousel(radar, locationName) {
  var bbox = radar.bbox;
  var w = radar.width;
  var h = radar.height;
  var frames = radar.frames || [{ image_base64: radar.image_base64, label: 'Now', type: 'radar', precip_type: radar.precip_type || 'rain' }];
  var isSnow = (radar.precip_type || 'rain') === 'snow';

  var overlay = buildMapOverlay(bbox, w, h, radar, locationName, { idPrefix: 'radar', showTargetValue: true });
  var toX = overlay.toX, toY = overlay.toY;
  var svg = overlay.baseSvg;
  var midSvg = overlay.midSvg;
  var labelSvg = overlay.labelSvg;

  // --- Build carousel frames ---
  var html = '<div class="radar-card">';
  html += '<div class="radar-header">' +
    '<div><span class="radar-title">Radar & Forecast</span>' +
    '<div class="radar-subtitle">Environment Canada · Map: OpenStreetMap · Pinch or scroll to zoom</div></div>' +
    '<div class="radar-frame-nav">' +
      '<button class="radar-nav-btn" onclick="radarTogglePlay()" id="radarPlayBtn" aria-label="Play animation">&#9654;&#9654;</button>' +
      '<button class="radar-nav-btn" onclick="radarNav(-1)" aria-label="Previous frame">&#9664;</button>' +
      '<span class="radar-frame-label" id="radarFrameLabel">' + esc(frames[0].label) + '</span>' +
      '<button class="radar-nav-btn" onclick="radarNav(1)" aria-label="Next frame">&#9654;</button>' +
    '</div>' +
  '</div>';

  // Time slider
  html += '<div class="radar-slider-wrap">';
  html += '<div class="radar-slider-labels" id="radarSliderLabels">';
  for (var fi = 0; fi < frames.length; fi++) {
    html += '<span' + (fi === 0 ? ' class="active"' : '') + ' onclick="radarGo(' + fi + ')">' + esc(frames[fi].label) + '</span>';
  }
  html += '</div>';
  html += '<input type="range" class="radar-time-slider" id="radarTimeSlider" min="0" max="' + (frames.length - 1) + '" value="0" oninput="radarGo(parseInt(this.value))">';
  html += '</div>';

  // Numeric precip readout for the selected frame — actual mm/cm, not just color
  html += '<div class="radar-precip-readout" id="radarPrecipReadout"></div>';

  // Zoomable map container
  html += '<div class="radar-zoom-wrap" id="radarZoomWrap">';
  html += '<div class="radar-container" id="radarContainer">';
  html += svg;
  for (var fi = 0; fi < frames.length; fi++) {
    html += '<img src="data:image/png;base64,' + frames[fi].image_base64 + '" class="radar-frame-img' +
      (fi === 0 ? ' active' : '') + '" data-frame="' + fi + '" alt="' + esc(frames[fi].label) + '"/>';
  }
  html += midSvg;
  html += labelSvg;
  html += '</div></div>';

  // Legend - a compact horizontal gradient bar with labels, styled to match
  // the rest of the dashboard. EC's GetLegendGraphic image is a tall vertical
  // strip (~124x413px) that looks out of place rendered at native aspect
  // ratio in a horizontal panel, so it's intentionally not used here.
  var precipWord = isSnow ? 'snow' : 'rain';
  html += '<div id="radarLegendBlock">';
  // Radar legend (frame 0)
  html += '<div class="radar-legend-section" id="legendRadar">';
  html += '<div class="radar-legend"><div class="radar-legend-bar"></div></div>';
  html += '<div class="radar-legend-labels"><span>Very light</span><span>Light</span><span>Moderate</span><span>Heavy</span><span>Intense</span></div>';
  html += '<div class="radar-explain">' +
    'Live radar showing where ' + precipWord + ' is falling <strong style="color:#8898b0">right now</strong>, straight from Environment Canada\'s own color scale.' +
  '</div></div>';
  // Forecast legend
  html += '<div class="radar-legend-section" id="legendForecast" style="display:none">';
  html += '<div class="radar-legend"><div class="radar-legend-bar" style="background:linear-gradient(90deg,#0a1a40 0%,#1a3a80 15%,#00a0c0 30%,#60d0a0 42%,#e0e040 55%,#f0a020 68%,#e04020 80%,#c01060 90%,#ff40c0 100%)"></div></div>';
  html += '<div class="radar-legend-labels"><span>0%</span><span>20%</span><span>40%</span><span>60%</span><span>80%</span><span>100%</span></div>';
  html += '<div class="radar-explain">' +
    'HRDPS forecast: <strong style="color:#8898b0">probability of ' + precipWord + '</strong> at the selected time, EC\'s own color scale.' +
  '</div></div>';
  html += '</div>';

  html += '</div>';

  window.__radarMeta = {
    count: frames.length,
    labels: frames.map(function(f){ return f.label }),
    types: frames.map(function(f){ return f.type }),
    rainMm: frames.map(function(f){ return f.rain_mm }),
    snowCm: frames.map(function(f){ return f.snow_cm }),
    precipProb: frames.map(function(f){ return f.precip_prob_pct }),
    rainRateMmh: frames.map(function(f){ return f.rain_rate_mmh })
  };

  return html;
}

// ───── Temperature / snowfall gridded maps ─────
// Renders a filled heatmap (temperature) or a banded accumulation map
// (snowfall) on <canvas>, from a regular lat/lon grid, via bilinear
// interpolation. No contouring library — the grid is regular, so
// interpolation is a cheap O(1)-per-pixel lookup, and "bands" for snow
// are just quantized color steps with a boundary-pixel outline pass.

var TEMP_STOPS = [
  { t: -30, c: [70, 10, 110] },
  { t: -20, c: [100, 20, 160] },
  { t: -10, c: [70, 60, 200] },
  { t: 0, c: [70, 130, 230] },
  { t: 5, c: [110, 180, 240] },
  { t: 10, c: [170, 220, 250] },
  { t: 15, c: [230, 250, 230] },
  { t: 20, c: [255, 230, 120] },
  { t: 25, c: [255, 175, 60] },
  { t: 30, c: [255, 100, 40] },
  { t: 35, c: [220, 40, 30] },
  { t: 40, c: [140, 10, 20] },
];

var SNOW_THRESH = [0, 2, 5, 10, 20, 30, 50, 75, 100];
var SNOW_COLORS = [
  null,
  [80, 220, 210],
  [40, 180, 225],
  [50, 120, 230],
  [90, 80, 225],
  [140, 60, 210],
  [180, 40, 190],
  [215, 30, 150],
  [255, 60, 170],
];

function tempColor(t) {
  if (t == null) return null;
  var s = TEMP_STOPS;
  if (t <= s[0].t) return s[0].c;
  if (t >= s[s.length - 1].t) return s[s.length - 1].c;
  for (var i = 0; i < s.length - 1; i++) {
    if (t >= s[i].t && t <= s[i + 1].t) {
      var f = (t - s[i].t) / (s[i + 1].t - s[i].t);
      return [
        Math.round(s[i].c[0] + (s[i + 1].c[0] - s[i].c[0]) * f),
        Math.round(s[i].c[1] + (s[i + 1].c[1] - s[i].c[1]) * f),
        Math.round(s[i].c[2] + (s[i + 1].c[2] - s[i].c[2]) * f),
      ];
    }
  }
  return s[s.length - 1].c;
}

function snowBandIndex(v) {
  if (v == null) return -1;
  var idx = 0;
  for (var i = 1; i < SNOW_THRESH.length; i++) { if (v >= SNOW_THRESH[i]) idx = i; }
  return idx;
}

function bilinearSample(values, nx, ny, fx, fy) {
  var i0 = Math.max(0, Math.min(Math.floor(fx), nx - 1));
  var j0 = Math.max(0, Math.min(Math.floor(fy), ny - 1));
  var i1 = Math.min(i0 + 1, nx - 1);
  var j1 = Math.min(j0 + 1, ny - 1);
  var tx = Math.min(1, Math.max(0, fx - i0));
  var ty = Math.min(1, Math.max(0, fy - j0));
  var v00 = values[j0 * nx + i0], v01 = values[j0 * nx + i1];
  var v10 = values[j1 * nx + i0], v11 = values[j1 * nx + i1];
  if (v00 == null || v01 == null || v10 == null || v11 == null) return null;
  var top = v00 + (v01 - v00) * tx;
  var bot = v10 + (v11 - v10) * tx;
  return top + (bot - top) * ty;
}

function renderClimateCanvas(canvas, values, nx, ny, bbox, kind) {
  var w = canvas.width, h = canvas.height;
  var ctx = canvas.getContext('2d');
  var img = ctx.createImageData(w, h);
  var data = img.data;
  var lonSpan = bbox.lon_max - bbox.lon_min, latSpan = bbox.lat_max - bbox.lat_min;
  var band = kind === 'snow' ? new Int8Array(w * h) : null;

  for (var py = 0; py < h; py++) {
    var lat = bbox.lat_max - (py / h) * latSpan;
    var fy = (lat - bbox.lat_min) / latSpan * (ny - 1);
    for (var px = 0; px < w; px++) {
      var lon = bbox.lon_min + (px / w) * lonSpan;
      var fx = (lon - bbox.lon_min) / lonSpan * (nx - 1);
      var v = bilinearSample(values, nx, ny, fx, fy);
      var idx = (py * w + px) * 4;
      if (kind === 'temp') {
        var c = tempColor(v);
        if (c) { data[idx] = c[0]; data[idx + 1] = c[1]; data[idx + 2] = c[2]; data[idx + 3] = 255; }
      } else {
        var bi = snowBandIndex(v);
        band[py * w + px] = bi;
        if (bi > 0) {
          var col = SNOW_COLORS[bi];
          data[idx] = col[0]; data[idx + 1] = col[1]; data[idx + 2] = col[2]; data[idx + 3] = 255;
        }
      }
    }
  }

  if (kind === 'snow') {
    // Boundary pass: darken pixels where the band changes, giving the
    // flat-color regions crisp outlines like a typical accumulation map.
    for (var py2 = 0; py2 < h - 1; py2++) {
      for (var px2 = 0; px2 < w - 1; px2++) {
        var i = py2 * w + px2;
        var b = band[i], bR = band[i + 1], bD = band[i + w];
        if ((b !== bR || b !== bD) && (b > 0 || bR > 0 || bD > 0)) {
          var idx2 = i * 4;
          data[idx2] = 16; data[idx2 + 1] = 20; data[idx2 + 2] = 32; data[idx2 + 3] = 235;
        }
      }
    }
  }

  ctx.putImageData(img, 0, 0);
}

function buildClimateMap(cm, kind, locationName) {
  var bbox = cm.bbox;
  var w = 620, h = 480;
  var nx = cm.grid.nx, ny = cm.grid.ny;
  var frames = (kind === 'temp' ? cm.temp_frames : cm.snow_frames) || [];
  if (!frames.length) return '';

  var idPrefix = kind === 'temp' ? 'tempMap' : 'snowMap';
  var overlay = buildMapOverlay(bbox, w, h, cm, locationName, {
    showValues: kind === 'temp',
    idPrefix: idPrefix,
  });
  var title = kind === 'temp' ? 'Temperature Map' : 'Snowfall Accumulation';
  var subtitle = kind === 'temp'
    ? 'Open-Meteo (GEM model), interpolated · Pinch or scroll to zoom'
    : 'Open-Meteo (GEM model), cumulative from now · Pinch or scroll to zoom';

  var html = '<div class="radar-card">';
  html += '<div class="radar-header">' +
    '<div><span class="radar-title">' + esc(title) + '</span>' +
    '<div class="radar-subtitle">' + esc(subtitle) + '</div></div>' +
    '<div class="radar-frame-nav">' +
      '<button class="radar-nav-btn" onclick="' + idPrefix + 'TogglePlay()" id="' + idPrefix + 'PlayBtn" aria-label="Play animation">&#9654;&#9654;</button>' +
      '<button class="radar-nav-btn" onclick="' + idPrefix + 'Nav(-1)" aria-label="Previous frame">&#9664;</button>' +
      '<span class="radar-frame-label" id="' + idPrefix + 'FrameLabel">' + esc(frames[0].label) + '</span>' +
      '<button class="radar-nav-btn" onclick="' + idPrefix + 'Nav(1)" aria-label="Next frame">&#9654;</button>' +
    '</div>' +
  '</div>';

  html += '<div class="radar-slider-wrap">';
  html += '<div class="radar-slider-labels" id="' + idPrefix + 'SliderLabels">';
  for (var fi = 0; fi < frames.length; fi++) {
    html += '<span' + (fi === 0 ? ' class="active"' : '') + ' onclick="' + idPrefix + 'Go(' + fi + ')">' + esc(frames[fi].label) + '</span>';
  }
  html += '</div>';
  html += '<input type="range" class="radar-time-slider" id="' + idPrefix + 'TimeSlider" min="0" max="' + (frames.length - 1) + '" value="0" oninput="' + idPrefix + 'Go(parseInt(this.value))">';
  html += '</div>';

  html += '<div class="climate-readout" id="' + idPrefix + 'Readout"></div>';

  html += '<div class="radar-zoom-wrap" id="' + idPrefix + 'ZoomWrap">';
  html += '<div class="radar-container" id="' + idPrefix + 'Container">';
  html += overlay.baseSvg;
  for (var fj = 0; fj < frames.length; fj++) {
    html += '<canvas class="climate-canvas' + (fj === 0 ? ' active' : '') + '" data-frame="' + fj + '" id="' + idPrefix + 'Canvas' + fj + '" width="' + w + '" height="' + h + '"></canvas>';
  }
  html += overlay.midSvg;
  html += overlay.labelSvg;
  html += '</div></div>';

  if (kind === 'temp') {
    html += '<div class="climate-legend">' +
      TEMP_STOPS.map(function(s) { return '<div style="background:rgb(' + s.c.join(',') + ')"></div>'; }).join('') +
    '</div>';
    html += '<div class="climate-legend-labels">' +
      TEMP_STOPS.filter(function(s, i) { return i % 2 === 0; }).map(function(s) { return '<span>' + s.t + '°</span>'; }).join('') +
    '</div>';
    html += '<div class="radar-explain">Interpolated 2m air temperature across the region from the GEM model, sampled at a grid of points — an approximation of a true satellite/radar temperature analysis, but the same idea: color shows the pattern, city labels show where you are in it.</div>';
  } else {
    html += '<div class="climate-legend">' +
      SNOW_COLORS.slice(1).map(function(c) { return '<div style="background:rgb(' + c.join(',') + ')"></div>'; }).join('') +
    '</div>';
    html += '<div class="climate-legend-labels">' +
      SNOW_THRESH.slice(1).map(function(t) { return '<span>' + t + 'cm</span>'; }).join('') +
    '</div>';
    html += '<div class="radar-explain">Cumulative snowfall accumulation from now through the selected time, banded like a typical snow-total forecast graphic. Colored area means 2cm or more is expected by that time; white/blank areas expect less.</div>';
  }

  html += '</div>';

  window[idPrefix + 'Meta'] = {
    count: frames.length,
    labels: frames.map(function(f) { return f.label; }),
    values: frames.map(function(f) { return f.values; }),
    nx: nx, ny: ny, bbox: bbox, kind: kind,
    cities: cm.cities || [],
  };

  return html;
}

function initClimateMapCarousel(idPrefix, kind) {
  var wrap = document.getElementById(idPrefix + 'ZoomWrap');
  var meta = window[idPrefix + 'Meta'];
  if (!wrap || !meta) return;

  for (var fi = 0; fi < meta.count; fi++) {
    var canvas = document.getElementById(idPrefix + 'Canvas' + fi);
    if (canvas) renderClimateCanvas(canvas, meta.values[fi], meta.nx, meta.ny, meta.bbox, kind);
  }

  var idx = 0, playTimer = null;

  window[idPrefix + 'Go'] = function(i) {
    idx = Math.max(0, Math.min(i, meta.count - 1));
    wrap.querySelectorAll('.climate-canvas').forEach(function(c) {
      c.classList.toggle('active', parseInt(c.dataset.frame) === idx);
    });
    var slider = document.getElementById(idPrefix + 'TimeSlider');
    if (slider) slider.value = idx;
    document.querySelectorAll('#' + idPrefix + 'SliderLabels span').forEach(function(s, j) {
      s.classList.toggle('active', j === idx);
    });
    var lbl = document.getElementById(idPrefix + 'FrameLabel');
    if (lbl) lbl.textContent = meta.labels[idx] || '';

    // Push a live value into each city's label ("Barrie -3°") instead of
    // making the reader infer it from color — sampled the same way the
    // canvas colors are (bilinear off the same grid), so the number always
    // matches what's under that city's pin.
    if (kind === 'temp' && meta.cities && meta.cities.length) {
      var frameVals = meta.values[idx];
      meta.cities.forEach(function(c, ci) {
        var el = document.getElementById(idPrefix + 'CityLabel' + ci);
        if (!el) return;
        var fx = (c.lon - meta.bbox.lon_min) / (meta.bbox.lon_max - meta.bbox.lon_min) * (meta.nx - 1);
        var fy = (c.lat - meta.bbox.lat_min) / (meta.bbox.lat_max - meta.bbox.lat_min) * (meta.ny - 1);
        var v = bilinearSample(frameVals, meta.nx, meta.ny, fx, fy);
        el.textContent = c.name + (v != null ? ' ' + Math.round(v) + '°' : '');
      });
    }

    var readout = document.getElementById(idPrefix + 'Readout');
    if (readout) {
      var vals = (meta.values[idx] || []).filter(function(v) { return v != null; });
      if (kind === 'temp') {
        if (vals.length) {
          var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
          readout.innerHTML = '<span class="cr-big">' + mn + '° to ' + mx + '°C</span><span>range across the region</span>';
        } else readout.innerHTML = '';
      } else {
        var mx2 = vals.length ? Math.max.apply(null, vals) : 0;
        readout.innerHTML = mx2 >= 2
          ? '<span class="cr-big">up to ' + mx2.toFixed(1) + ' cm</span><span>local max, this period</span>'
          : '<span style="color:#5a6a85;font-weight:500">No meaningful accumulation expected</span>';
      }
    }
  };
  window[idPrefix + 'Nav'] = function(d) { window[idPrefix + 'Go'](idx + d); };
  window[idPrefix + 'TogglePlay'] = function() {
    var btn = document.getElementById(idPrefix + 'PlayBtn');
    if (playTimer) {
      clearInterval(playTimer); playTimer = null;
      if (btn) btn.innerHTML = '&#9654;&#9654;';
      return;
    }
    if (btn) btn.innerHTML = '&#10074;&#10074;';
    playTimer = setInterval(function() {
      var next = idx + 1;
      if (next > meta.count - 1) next = 0;
      window[idPrefix + 'Go'](next);
    }, 900);
  };

  // Zoom / pan — same behavior as the radar carousel.
  var scale = 1, tx = 0, ty = 0, dragging = false, lastX = 0, lastY = 0;
  var cont = document.getElementById(idPrefix + 'Container');
  function clamp() {
    var r = wrap.getBoundingClientRect();
    var mX = r.width * (scale - 1) / 2, mY = r.height * (scale - 1) / 2;
    tx = Math.max(-mX, Math.min(mX, tx));
    ty = Math.max(-mY, Math.min(mY, ty));
  }
  function apply() { if (cont) cont.style.transform = 'scale(' + scale + ') translate(' + (tx / scale) + 'px,' + (ty / scale) + 'px)'; }
  wrap.addEventListener('wheel', function(e) {
    e.preventDefault();
    var d = e.deltaY > 0 ? 0.9 : 1.1;
    scale = Math.max(1, Math.min(5, scale * d));
    if (scale <= 1) { tx = 0; ty = 0; }
    apply();
  }, { passive: false });
  var lastDist = 0;
  wrap.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2) { lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
    else if (e.touches.length === 1 && scale > 1) { dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
  });
  wrap.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2) {
      e.preventDefault();
      var nd = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      scale = Math.max(1, Math.min(5, scale * (nd / lastDist))); lastDist = nd;
      if (scale <= 1) { tx = 0; ty = 0; } apply();
    } else if (dragging && e.touches.length === 1) {
      e.preventDefault();
      tx += e.touches[0].clientX - lastX; ty += e.touches[0].clientY - lastY;
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; clamp(); apply();
    }
  }, { passive: false });
  wrap.addEventListener('touchend', function() { dragging = false; lastDist = 0; });
  wrap.addEventListener('mousedown', function(e) { if (scale > 1) { dragging = true; lastX = e.clientX; lastY = e.clientY; e.preventDefault(); } });
  window.addEventListener('mousemove', function(e) { if (dragging) { tx += e.clientX - lastX; ty += e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; clamp(); apply(); } });
  window.addEventListener('mouseup', function() { dragging = false; });
  wrap.addEventListener('dblclick', function() { scale = 1; tx = 0; ty = 0; apply(); });

  window[idPrefix + 'Go'](0);
}

function buildModelBars(title, totals, unit, color) {
  const entries = Object.entries(totals);
  if (!entries.length || entries.every(function(e) { return e[1] === 0; })) return '';
  const mx = Math.max(1, ...entries.map(function(e) { return e[1]; }));
  let html = '<div class="model-section-title">' + esc(title) + '</div>';
  for (const e of entries) {
    const pct = (e[1]/mx*100).toFixed(0);
    html += '<div class="precip-bar">' +
      '<span class="bar-label">' + esc(e[0]) + '</span>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
      '<span class="bar-value">' + e[1] + ' ' + unit + '</span>' +
    '</div>';
  }
  return html;
}

render();

// ── Radar carousel + zoom ──
(function(){
  var wrap = document.getElementById('radarZoomWrap');
  if (!wrap || !window.__radarMeta) return;
  var radarFrames = window.__radarMeta.count;
  var radarLabels = window.__radarMeta.labels;
  var radarTypes = window.__radarMeta.types;
  var radarRainMm = window.__radarMeta.rainMm;
  var radarSnowCm = window.__radarMeta.snowCm;
  var radarPrecipProb = window.__radarMeta.precipProb;
  var radarRainRateMmh = window.__radarMeta.rainRateMmh;
  var radarIdx = 0;
  var radarPlayTimer = null;
  var radarTargetLabelEl = document.getElementById('radarTargetLabel');
  var radarTargetName = radarTargetLabelEl ? radarTargetLabelEl.textContent : '';

  window.radarGo = function(i) {
    radarIdx = Math.max(0, Math.min(i, radarFrames - 1));
    var imgs = document.querySelectorAll('.radar-frame-img');
    imgs.forEach(function(img){ img.classList.toggle('active', parseInt(img.dataset.frame) === radarIdx) });
    var slider = document.getElementById('radarTimeSlider');
    if (slider) slider.value = radarIdx;
    var sliderLabels = document.querySelectorAll('#radarSliderLabels span');
    sliderLabels.forEach(function(s, j){ s.classList.toggle('active', j === radarIdx) });
    var lbl = document.getElementById('radarFrameLabel');
    if (lbl) lbl.textContent = radarLabels[radarIdx] || '';
    var isFC = radarTypes[radarIdx] === 'forecast';
    var lr = document.getElementById('legendRadar');
    var lf = document.getElementById('legendForecast');
    if (lr) lr.style.display = isFC ? 'none' : '';
    if (lf) lf.style.display = isFC ? '' : 'none';

    // Live value beside the target city's own label — % chance of
    // precip for forecast frames, live rain rate for "Now" — read from
    // the exact map pixel, same as the readout below the map.
    if (radarTargetLabelEl) {
      if (isFC) {
        var probVal = radarPrecipProb ? radarPrecipProb[radarIdx] : null;
        radarTargetLabelEl.textContent = radarTargetName + (probVal != null ? ' ' + probVal + '%' : '');
      } else {
        var rateVal = radarRainRateMmh ? radarRainRateMmh[radarIdx] : null;
        radarTargetLabelEl.textContent = radarTargetName + (rateVal != null ? ' ' + rateVal.toFixed(1) + 'mm/h' : '');
      }
    }

    var readout = document.getElementById('radarPrecipReadout');
    if (readout) {
      var rain = radarRainMm ? radarRainMm[radarIdx] : null;
      var snow = radarSnowCm ? radarSnowCm[radarIdx] : null;
      var prob = radarPrecipProb ? radarPrecipProb[radarIdx] : null;
      var rate = radarRainRateMmh ? radarRainRateMmh[radarIdx] : null;
      var parts = [];
      if (isFC) {
        // Probability is read from the exact map pixel — always matches the color shown.
        if (prob != null) parts.push('<span class="radar-precip-prob-main">' + prob + '% chance <span class="radar-precip-tag">(this map)</span></span>');
        var amtBits = [];
        if (snow != null && snow > 0) amtBits.push(snow + ' cm snow');
        if (rain != null && rain > 0) amtBits.push(rain + ' mm rain');
        if (amtBits.length) parts.push('<span class="radar-precip-amt">Expected: ' + amtBits.join(' + ') + ' <span class="radar-precip-tag">(model forecast)</span></span>');
        if (!parts.length) parts.push('<span class="radar-precip-none">No precipitation expected</span>');
      } else {
        // "Now": rate is read from the exact radar pixel — always matches the color shown.
        if (rate != null) {
          parts.push(rate > 0
            ? '<span class="radar-precip-rain">🌧 ' + rate + ' mm/h right now <span class="radar-precip-tag">(this map)</span></span>'
            : '<span class="radar-precip-none">No precipitation at this location right now</span>');
        }
      }
      readout.innerHTML = parts.join('<span class="radar-precip-sep">·</span>');
    }
  };
  window.radarNav = function(d){ window.radarGo(radarIdx + d) };

  window.radarTogglePlay = function() {
    var btn = document.getElementById('radarPlayBtn');
    if (radarPlayTimer) {
      clearInterval(radarPlayTimer);
      radarPlayTimer = null;
      if (btn) btn.innerHTML = '&#9654;&#9654;';
      return;
    }
    if (btn) btn.innerHTML = '&#10074;&#10074;';
    radarPlayTimer = setInterval(function() {
      var next = radarIdx + 1;
      if (next > radarFrames - 1) next = 0;
      window.radarGo(next);
    }, 900);
  };

  // Zoom
  var rzScale=1, rzX=0, rzY=0, rzDragging=false, rzLastX=0, rzLastY=0;
  var rzCont = document.getElementById('radarContainer');
  function rzClamp() {
    var r = wrap.getBoundingClientRect();
    var mX = r.width*(rzScale-1)/2, mY = r.height*(rzScale-1)/2;
    rzX = Math.max(-mX, Math.min(mX, rzX));
    rzY = Math.max(-mY, Math.min(mY, rzY));
  }
  function rzApply() {
    if (rzCont) rzCont.style.transform = 'scale('+rzScale+') translate('+(rzX/rzScale)+'px,'+(rzY/rzScale)+'px)';
  }
  wrap.addEventListener('wheel', function(e){
    e.preventDefault();
    var d = e.deltaY > 0 ? 0.9 : 1.1;
    rzScale = Math.max(1, Math.min(5, rzScale*d));
    if (rzScale <= 1) { rzX=0; rzY=0 }
    rzApply();
  }, {passive:false});
  var lastDist = 0;
  wrap.addEventListener('touchstart', function(e){
    if (e.touches.length===2) { lastDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY) }
    else if (e.touches.length===1 && rzScale>1) { rzDragging=true; rzLastX=e.touches[0].clientX; rzLastY=e.touches[0].clientY }
  });
  wrap.addEventListener('touchmove', function(e){
    if (e.touches.length===2) {
      e.preventDefault();
      var nd = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      rzScale = Math.max(1, Math.min(5, rzScale*(nd/lastDist))); lastDist=nd;
      if (rzScale<=1) { rzX=0; rzY=0 } rzApply();
    } else if (rzDragging && e.touches.length===1) {
      e.preventDefault();
      rzX += e.touches[0].clientX-rzLastX; rzY += e.touches[0].clientY-rzLastY;
      rzLastX = e.touches[0].clientX; rzLastY = e.touches[0].clientY; rzClamp(); rzApply();
    }
  }, {passive:false});
  wrap.addEventListener('touchend', function(){ rzDragging=false; lastDist=0 });
  wrap.addEventListener('mousedown', function(e){ if(rzScale>1){rzDragging=true;rzLastX=e.clientX;rzLastY=e.clientY;e.preventDefault()} });
  window.addEventListener('mousemove', function(e){ if(rzDragging){rzX+=e.clientX-rzLastX;rzY+=e.clientY-rzLastY;rzLastX=e.clientX;rzLastY=e.clientY;rzClamp();rzApply()} });
  window.addEventListener('mouseup', function(){ rzDragging=false });
  wrap.addEventListener('dblclick', function(){ rzScale=1; rzX=0; rzY=0; rzApply() });

  // Keyboard nav
  document.addEventListener('keydown', function(e){
    if (e.key==='ArrowLeft') window.radarNav(-1);
    else if (e.key==='ArrowRight') window.radarNav(1);
  });

  window.radarGo(0);
})();

initClimateMapCarousel('tempMap', 'temp');
initClimateMapCarousel('snowMap', 'snow');
